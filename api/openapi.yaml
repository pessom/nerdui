openapi: 3.1.0
info:
  title: nerdui API
  description: |
    HTTP API of nerdui — a web UI for nerdctl/containerd.

    This file is the source of truth for the API contract. TypeScript types for
    the frontend are generated from it (`make api-gen`); Go handlers must be kept
    in sync manually (see `internal/server`).
  version: 0.1.0
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: /
tags:
  - name: system
    description: Health and version information
  - name: auth
    description: First-run setup, login and sessions (ADR-0005)
security:
  - session: []
paths:
  /healthz:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Server is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/version:
    get:
      tags: [system]
      operationId: getVersion
      summary: nerdui and runtime versions
      description: |
        Public. Build information, including the source URL required by AGPL-3.0
        section 13, is always returned. `runtime` and `error` are only included for
        authenticated requests. When containerd is unreachable, `runtime.containerd`
        is empty and `error` describes the problem.
      security: [{}, session: []]
      responses:
        "200":
          description: Version information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
  /api/v1/setup:
    get:
      tags: [auth]
      operationId: getSetupStatus
      summary: Whether the first admin account still has to be created
      security: []
      responses:
        "200":
          description: Setup status
          content:
            application/json:
              schema:
                type: object
                required: [required]
                properties:
                  required: { type: boolean }
    post:
      tags: [auth]
      operationId: setup
      summary: Create the first admin account using the setup token from the server log
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, username, password]
              additionalProperties: false
              properties:
                token: { type: string, description: One-time token printed to the server log }
                username: { type: string, pattern: "^[A-Za-z0-9._-]{1,64}$" }
                password: { type: string, minLength: 12, maxLength: 1024 }
      responses:
        "201":
          description: Admin created and logged in; sets the session cookie
          headers:
            Set-Cookie: { schema: { type: string }, description: "nerdui_session (HttpOnly, SameSite=Strict)" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in with username and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              additionalProperties: false
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Logged in; sets the session cookie
          headers:
            Set-Cookie: { schema: { type: string }, description: "nerdui_session (HttpOnly, SameSite=Strict)" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Current user and CSRF token
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the current session
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204": { description: Logged out; clears the session cookie }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: nerdui_session
      description: |
        Server-side session (ADR-0005). Unsafe requests (POST, PUT, PATCH, DELETE) must also
        send the session's CSRF token in the X-CSRF-Token header.
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
      description: CSRF token from SessionResponse.csrfToken
  responses:
    Error:
      description: Error (ADR-0006)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many attempts
      headers:
        Retry-After: { schema: { type: integer }, description: Seconds to wait }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    BuildInfo:
      type: object
      required: [version, commit, date, goVersion, platform, source, license]
      properties:
        source:
          type: string
          format: uri
          description: Source code of the running build (AGPL-3.0 section 13).
          examples: ["https://github.com/pessom/nerdui"]
        license:
          type: string
          description: SPDX license identifier.
          examples: ["AGPL-3.0-only"]
        version: { type: string, examples: ["v0.1.0"] }
        commit: { type: string }
        date: { type: string }
        goVersion: { type: string, examples: ["go1.27.4"] }
        platform: { type: string, examples: ["linux/amd64"] }
    RuntimeVersions:
      type: object
      required: [containerd, containerdRevision, nerdctlLibrary]
      properties:
        containerd: { type: string, examples: ["v2.4.2"] }
        containerdRevision: { type: string }
        nerdctlLibrary: { type: string, examples: ["v2.4.2"] }
    VersionResponse:
      type: object
      required: [nerdui]
      properties:
        nerdui:
          $ref: "#/components/schemas/BuildInfo"
        runtime:
          $ref: "#/components/schemas/RuntimeVersions"
        error:
          type: string
    User:
      type: object
      required: [id, username, role]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        role: { type: string, enum: [admin] }
    SessionResponse:
      type: object
      required: [user, csrfToken, expiresAt]
      properties:
        user: { $ref: "#/components/schemas/User" }
        csrfToken: { type: string }
        expiresAt: { type: string, format: date-time }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_argument, unauthenticated, forbidden, csrf_failed, not_found, conflict,
                     rate_limited, unsupported_media_type, internal, unavailable]
            message: { type: string }

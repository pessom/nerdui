openapi: 3.1.0
info:
  title: nerdui API
  description: |
    HTTP API of nerdui — a web UI for nerdctl/containerd.

    This file is the source of truth for the API contract. TypeScript types for
    the frontend are generated from it (`make api-gen`); Go handlers must be kept
    in sync manually (see `internal/server`).
  version: 0.1.0
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: /
tags:
  - name: system
    description: Health and version information
  - name: auth
    description: First-run setup, login and sessions (ADR-0005)
  - name: environments
    description: Managed containerd hosts (ADR-0006); MVP has only "local"
  - name: containers
    description: Containers of an environment
  - name: users
    description: Local users (#74, ADR-0016); every user is an administrator until roles (#78)
security:
  - session: []
paths:
  /healthz:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Server is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/version:
    get:
      tags: [system]
      operationId: getVersion
      summary: nerdui and runtime versions
      description: |
        Public. Build information, including the source URL required by AGPL-3.0
        section 13, is always returned. `runtime` and `error` are only included for
        authenticated requests. When containerd is unreachable, `runtime.containerd`
        is empty and `error` describes the problem.
      security: [{}, session: []]
      responses:
        "200":
          description: Version information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
  /api/v1/setup:
    get:
      tags: [auth]
      operationId: getSetupStatus
      summary: Whether the first admin account still has to be created
      security: []
      responses:
        "200":
          description: Setup status
          content:
            application/json:
              schema:
                type: object
                required: [required]
                properties:
                  required: { type: boolean }
    post:
      tags: [auth]
      operationId: setup
      summary: Create the first admin account using the setup token from the server log
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, username, password]
              additionalProperties: false
              properties:
                token: { type: string, description: One-time token printed to the server log }
                username: { type: string, pattern: "^[A-Za-z0-9._-]{1,64}$" }
                password: { type: string, minLength: 12, maxLength: 1024 }
      responses:
        "201":
          description: Admin created and logged in; sets the session cookie
          headers:
            Set-Cookie: { schema: { type: string }, description: "nerdui_session (HttpOnly, SameSite=Strict)" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in with username and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              additionalProperties: false
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Logged in; sets the session cookie
          headers:
            Set-Cookie: { schema: { type: string }, description: "nerdui_session (HttpOnly, SameSite=Strict)" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Current user and CSRF token
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the current session
      description: Unsafe request — send the session's CSRF token in `X-CSRF-Token` (see the `session` security scheme).
      responses:
        "204": { description: Logged out; clears the session cookie }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/auth/password:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Change the caller's own password
      description: |
        Verifies the current password (rate limited), clears `mustChangePassword` and revokes
        the caller's other sessions. Available while a temporary password is pending.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              additionalProperties: false
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 12 }
      responses:
        "200":
          description: Changed; the current session stays valid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/users:
    get:
      tags: [users]
      operationId: listUsers
      summary: List users
      description: "Requires `users:read`."
      responses:
        "200":
          description: Users sorted by name
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users: { type: array, items: { $ref: "#/components/schemas/UserDetail" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [users]
      operationId: createUser
      summary: Create a user with a temporary password
      description: |
        Requires `users:write`. Without `password`, one is generated and returned once in
        `generatedPassword`. The user must change it at the first sign-in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              additionalProperties: false
              properties:
                username: { type: string, pattern: "^[A-Za-z0-9._-]{1,64}$" }
                password: { type: string, minLength: 12 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPasswordResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/users/{id}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [users]
      operationId: getUser
      summary: Get a user
      description: "Requires `users:read`."
      responses:
        "200":
          description: User
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDetail" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [users]
      operationId: updateUser
      summary: Disable or enable a user
      description: |
        Requires `users:write`. Disabling revokes the user's sessions. The caller's own account
        and the last active administrator cannot be disabled (409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disabled]
              additionalProperties: false
              properties:
                disabled: { type: boolean }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDetail" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [users]
      operationId: deleteUser
      summary: Delete a user
      description: |
        Requires `users:write`. The caller's own account and the last active administrator
        cannot be deleted (409).
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/users/{id}/password:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [users]
      operationId: setUserPassword
      summary: Set a temporary password for another user
      description: |
        Requires `users:write`. Revokes the user's sessions; the user must change the password
        at the next sign-in. Without `password`, one is generated and returned once. Use
        `/auth/password` for your own account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                password: { type: string, minLength: 12 }
      responses:
        "200":
          description: Password set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPasswordResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/environments:
    get:
      tags: [environments]
      operationId: listEnvironments
      summary: List managed environments
      description: "Requires `system:read`."
      responses:
        "200":
          description: Environments
          content:
            application/json:
              schema:
                type: object
                required: [environments]
                properties:
                  environments:
                    type: array
                    items: { $ref: "#/components/schemas/Environment" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}:
    parameters:
      - $ref: "#/components/parameters/Env"
    get:
      tags: [environments]
      operationId: getEnvironment
      summary: Environment with live connectivity status and runtime versions
      description: "Requires `system:read`. Always 200 for a known environment; `status` tells whether containerd is reachable."
      responses:
        "200":
          description: Environment status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvironmentStatus" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/info:
    parameters:
      - $ref: "#/components/parameters/Env"
    get:
      tags: [environments]
      operationId: getEnvironmentInfo
      summary: Host and runtime information
      description: |
        Like `nerdctl info` and `nerdctl version`, plus containerd plugins (`ctr plugins ls`)
        and CNI plugins (#66, ADR-0015). Host fields describe the machine nerdui runs on.
        Requires `system:read`.
      responses:
        "200":
          description: Host and runtime information
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemInfo" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/namespaces:
    parameters:
      - $ref: "#/components/parameters/Env"
    get:
      tags: [environments]
      operationId: listNamespaces
      summary: containerd namespaces of the environment
      description: "Requires `system:read`."
      responses:
        "200":
          description: Namespaces, sorted
          content:
            application/json:
              schema:
                type: object
                required: [namespaces, default]
                properties:
                  namespaces:
                    type: array
                    items: { type: string }
                  default: { type: string, description: Default namespace of the environment }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/events/stream:
    parameters:
      - $ref: "#/components/parameters/Env"
    get:
      tags: [environments]
      operationId: streamEvents
      summary: containerd events (WebSocket)
      description: |
        WebSocket stream (ADR-0007); requires `system:read` and a same-origin upgrade.
        Text frames carry `StreamMessage` envelopes whose `data` is an `Event`. The first
        message is the connection state (`kind: nerdui`, `action: connected|disconnected`);
        clients refetch their data on `connected` because events missed during an outage are
        not replayed. A client that falls behind is closed with code 1013 and should reconnect.
      parameters:
        - name: namespace
          in: query
          schema: { type: string }
          description: containerd namespace; empty = environment default, `*` = all namespaces
        - name: topics
          in: query
          schema: { type: string, examples: ["/containers/,/tasks/"] }
          description: Comma-separated topic prefixes; empty = all topics
      responses:
        "101": { description: Switching protocols (WebSocket) }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/containers:
    parameters:
      - $ref: "#/components/parameters/Env"
      - $ref: "#/components/parameters/Namespace"
    get:
      tags: [containers]
      operationId: listContainers
      summary: All containers of a namespace (any state), newest first
      description: |
        Requires `containers:read`. Filtering and sorting are done by clients (ADR-0006).
        Live updates: refetch on events from `/events/stream`.
      responses:
        "200":
          description: Containers
          content:
            application/json:
              schema:
                type: object
                required: [namespace, containers]
                properties:
                  namespace: { type: string }
                  containers:
                    type: array
                    items: { $ref: "#/components/schemas/Container" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/containers/{id}/{action}:
    parameters:
      - $ref: "#/components/parameters/Env"
      - $ref: "#/components/parameters/ContainerID"
      - name: action
        in: path
        required: true
        schema: { type: string, enum: [start, stop, restart, kill, pause, unpause] }
      - $ref: "#/components/parameters/Namespace"
    post:
      tags: [containers]
      operationId: containerAction
      summary: Start, stop, restart, kill, pause or unpause a container
      description: |
        Requires `containers:operate`. Synchronous: stop and restart wait for the container to
        exit (its stop timeout, 10 s by default, then SIGKILL). Kill sends SIGKILL.
        Unsafe request — send the CSRF token. Answers 409 when the action does not apply to
        the current state (e.g. pause on a stopped container) and 503 `nerdctl_incompatible`
        in read-only mode. Other failures carry nerdctl's error message.
      responses:
        "204": { description: Done }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/containers/{id}:
    parameters:
      - $ref: "#/components/parameters/Env"
      - $ref: "#/components/parameters/ContainerID"
      - $ref: "#/components/parameters/Namespace"
    delete:
      tags: [containers]
      operationId: removeContainer
      summary: Remove a container
      description: |
        Requires `containers:write`. Like `nerdctl rm`: releases the name and published ports.
        A running or paused container is only removed with `force=true` (killed first);
        otherwise 409. Unsafe request — send the CSRF token.
      parameters:
        - name: force
          in: query
          schema: { type: boolean, default: false }
          description: Kill a running or paused container before removing it
        - name: volumes
          in: query
          schema: { type: boolean, default: false }
          description: Also remove the container's anonymous volumes
      responses:
        "204": { description: Removed }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/containers/{id}/inspect:
    parameters:
      - $ref: "#/components/parameters/Env"
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$", maxLength: 76 }
        description: Full or short container ID, or name (resolved like `nerdctl inspect`)
      - $ref: "#/components/parameters/Namespace"
    get:
      tags: [containers]
      operationId: inspectContainer
      summary: Full container configuration
      description: |
        Requires `containers:read`. Same JSON as `nerdctl inspect` (dockercompat mode,
        ADR-0013); only the fields used by the UI are described here. A reference that
        matches several containers → 400.
      parameters:
        - name: size
          in: query
          schema: { type: boolean, default: false }
          description: Also compute SizeRw and SizeRootFs (slow for large containers)
      responses:
        "200":
          description: Container
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContainerInspect" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/containers/{id}/logs:
    parameters:
      - $ref: "#/components/parameters/Env"
      - $ref: "#/components/parameters/ContainerID"
      - $ref: "#/components/parameters/Namespace"
    get:
      tags: [containers]
      operationId: downloadContainerLogs
      summary: Container logs as plain text (download)
      description: |
        Requires `containers:read`. Like `nerdctl logs` without `--follow`: stdout and stderr
        interleaved, ANSI sequences preserved. Sent as an attachment `<id12>-logs.txt`.
      parameters:
        - name: tail
          in: query
          schema: { type: string, examples: ["500", "all"] }
          description: Only the last N lines; empty or `all` = all lines
        - name: since
          in: query
          schema: { type: string, examples: ["2027-03-01T10:00:00Z", "10m"] }
          description: Lines at or after this time (RFC 3339 or relative), second precision
        - name: until
          in: query
          schema: { type: string }
          description: Lines at or before this time (RFC 3339 or relative)
        - name: timestamps
          in: query
          schema: { type: boolean, default: false }
          description: Prefix lines with their RFC 3339 time
      responses:
        "200":
          description: Log text
          content:
            text/plain:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/containers/{id}/logs/stream:
    parameters:
      - $ref: "#/components/parameters/Env"
      - $ref: "#/components/parameters/ContainerID"
      - $ref: "#/components/parameters/Namespace"
    get:
      tags: [containers]
      operationId: streamContainerLogs
      summary: Container logs (WebSocket)
      description: |
        WebSocket stream (ADR-0007, ADR-0014); requires `containers:read` and a same-origin
        upgrade. `StreamMessage.data` is an array of `LogLine`. The stream sends `end` when the
        logs are exhausted or, with `follow`, when the container stops. Errors (unknown
        container, log driver `none` → `conflict`) arrive as `error` followed by `end`.
        To resume after a disconnect, reconnect with `since` = last `ts` and skip lines up to it.
      parameters:
        - name: follow
          in: query
          schema: { type: boolean, default: false }
          description: Keep streaming new lines while the container runs
        - name: tail
          in: query
          schema: { type: string, examples: ["500", "all"] }
          description: Only the last N lines; empty or `all` = all lines
        - name: since
          in: query
          schema: { type: string, examples: ["2027-03-01T10:00:00Z", "10m"] }
          description: Lines at or after this time (RFC 3339 or relative), second precision
      responses:
        "101": { description: Switching protocols (WebSocket) }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/containers/actions:
    parameters:
      - $ref: "#/components/parameters/Env"
      - $ref: "#/components/parameters/Namespace"
    post:
      tags: [containers]
      operationId: bulkContainerAction
      summary: Apply one action to several containers
      description: |
        Requires `containers:operate`, and `containers:write` for `remove`. Up to 200 IDs; runs
        a few at a time and answers 200 with one result per ID in request order, so partial
        failures are reported per container. Unsafe request — send the CSRF token.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkActionRequest" }
      responses:
        "200":
          description: Per-container results
          content:
            application/json:
              schema:
                type: object
                required: [action, results]
                properties:
                  action: { $ref: "#/components/schemas/ContainerActionName" }
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/BulkActionResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: nerdui_session
      description: |
        Server-side session (ADR-0005). Unsafe requests (POST, PUT, PATCH, DELETE) must also
        send the session's CSRF token in the X-CSRF-Token header.
  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
      description: User ID
    Env:
      name: env
      in: path
      required: true
      schema: { type: string, examples: ["local"] }
      description: Environment ID
    Namespace:
      name: namespace
      in: query
      required: false
      schema: { type: string, examples: ["default", "k8s.io"] }
      description: containerd namespace; defaults to the environment's default namespace
    ContainerID:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$", maxLength: 76 }
      description: Full container ID (prefixes and names are not resolved)
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
      description: CSRF token from SessionResponse.csrfToken
  responses:
    Error:
      description: Error (ADR-0006)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many attempts
      headers:
        Retry-After: { schema: { type: integer }, description: Seconds to wait }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    BuildInfo:
      type: object
      required: [version, commit, date, goVersion, platform, source, license]
      properties:
        source:
          type: string
          format: uri
          description: Source code of the running build (AGPL-3.0 section 13).
          examples: ["https://github.com/pessom/nerdui"]
        license:
          type: string
          description: SPDX license identifier.
          examples: ["AGPL-3.0-only"]
        version: { type: string, examples: ["v0.1.0"] }
        commit: { type: string }
        date: { type: string }
        goVersion: { type: string, examples: ["go1.27.4"] }
        platform: { type: string, examples: ["linux/amd64"] }
    RuntimeVersions:
      type: object
      required: [containerd, containerdRevision, containerdSupported, nerdctlLibrary, nerdctl]
      properties:
        containerd: { type: string, examples: ["v2.4.2"] }
        containerdRevision: { type: string }
        containerdSupported:
          type: boolean
          description: False for containerd versions outside the supported set (ADR-0012); nerdui still works.
        nerdctlLibrary: { type: string, examples: ["v2.4.2"] }
        nerdctl: { $ref: "#/components/schemas/NerdctlStatus" }
    NerdctlStatus:
      type: object
      description: |
        Host nerdctl compatibility (ADR-0011). When neither `compatible` nor `checkSkipped` is
        true, the environment is read-only: mutating requests fail with 503 `nerdctl_incompatible`.
      required: [path, required, compatible]
      properties:
        path: { type: string, examples: ["nerdctl"] }
        version: { type: string, examples: ["2.4.2"] }
        required: { type: string, description: Required major.minor, examples: ["2.4"] }
        compatible: { type: boolean }
        checkSkipped: { type: boolean }
        error: { type: string }
    VersionResponse:
      type: object
      required: [nerdui]
      properties:
        nerdui:
          $ref: "#/components/schemas/BuildInfo"
        runtime:
          $ref: "#/components/schemas/RuntimeVersions"
        error:
          type: string
    Environment:
      type: object
      required: [id, name, kind, defaultNamespace]
      properties:
        id: { type: string, examples: ["local"] }
        name: { type: string }
        kind: { type: string, enum: [local] }
        defaultNamespace: { type: string }
    EnvironmentStatus:
      allOf:
        - $ref: "#/components/schemas/Environment"
        - type: object
          required: [status]
          properties:
            status: { type: string, enum: [connected, unavailable] }
            error: { type: string }
            runtime: { $ref: "#/components/schemas/RuntimeVersions" }
    Container:
      type: object
      required: [id, name, namespace, image, command, state, createdAt, ports, labels]
      properties:
        id: { type: string, description: Full container ID (64 hex characters) }
        name: { type: string, description: nerdctl name (may be empty for non-nerdctl containers) }
        namespace: { type: string }
        image: { type: string }
        command: { type: string }
        state: { type: string, enum: [created, running, paused, restarting, exited, unknown] }
        health: { type: string, enum: [healthy, unhealthy, starting] }
        exitCode: { type: integer }
        exitedAt: { type: string, format: date-time }
        startedAt:
          type: string
          format: date-time
          description: Start time of the container's main process (running/paused containers)
        createdAt: { type: string, format: date-time }
        ports:
          type: array
          items: { $ref: "#/components/schemas/Port" }
        compose: { $ref: "#/components/schemas/ComposeRef" }
        platform: { type: string }
        runtime: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }
    Port:
      type: object
      required: [hostPort, containerPort, protocol]
      properties:
        hostIp: { type: string }
        hostPort: { type: integer }
        containerPort: { type: integer }
        protocol: { type: string, enum: [tcp, udp, sctp] }
    ComposeRef:
      type: object
      required: [project]
      properties:
        project: { type: string }
        service: { type: string }
    Event:
      type: object
      required: [ts, topic, kind, action]
      properties:
        ts: { type: string, format: date-time }
        namespace: { type: string }
        topic: { type: string, examples: ["/containers/create", "/tasks/exit", "/nerdui/connected"] }
        kind: { type: string, examples: ["container", "task", "image", "namespace", "nerdui"] }
        action: { type: string, examples: ["create", "exit", "connected"] }
        id: { type: string, description: Container ID for container/task events, name for image/namespace events }
        attributes:
          type: object
          additionalProperties: { type: string }
          description: e.g. image, runtime, pid, exitStatus, execId
    StreamMessage:
      type: object
      description: WebSocket text-frame envelope (ADR-0007)
      required: [type, ts]
      properties:
        type: { type: string, enum: [data, error, end] }
        data: {}
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
        ts: { type: string, format: date-time }
    User:
      type: object
      required: [id, username, role, mustChangePassword]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        role: { type: string, enum: [admin] }
        mustChangePassword:
          type: boolean
          description: |
            A temporary password is pending: every other endpoint answers 403
            `password_change_required` until `POST /auth/password` succeeds.
    UserDetail:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [disabled, createdAt]
          properties:
            disabled: { type: boolean }
            createdAt: { type: string, format: date-time }
            lastLoginAt: { type: string, format: date-time }
    UserPasswordResponse:
      type: object
      properties:
        user: { $ref: "#/components/schemas/UserDetail" }
        generatedPassword:
          type: string
          description: Present only when the server generated the password; shown once
    SessionResponse:
      type: object
      required: [user, csrfToken, expiresAt]
      properties:
        user: { $ref: "#/components/schemas/User" }
        csrfToken: { type: string }
        expiresAt: { type: string, format: date-time }
    Error:
      type: object
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/ErrorDetail" }
    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [invalid_argument, unauthenticated, forbidden, csrf_failed, not_found, conflict,
                 rate_limited, unsupported_media_type, internal, unavailable, nerdctl_incompatible,
                 password_change_required]
        message: { type: string }
    ContainerInspect:
      type: object
      description: "`nerdctl inspect` output (Docker-compatible). Other fields may be present."
      additionalProperties: true
      required: [Id, Name]
      properties:
        Id: { type: string }
        Name: { type: string }
        Created: { type: string }
        Path: { type: string }
        Args: { type: [array, "null"], items: { type: string } }
        Image: { type: string }
        RestartCount: { type: integer }
        Platform: { type: string }
        State:
          type: [object, "null"]
          additionalProperties: true
          properties:
            Status: { type: string }
            Pid: { type: integer }
            ExitCode: { type: integer }
            Error: { type: string }
            StartedAt: { type: string }
            FinishedAt: { type: string }
        HostConfig:
          type: [object, "null"]
          additionalProperties: true
          properties:
            NetworkMode: { type: string }
            RestartPolicy:
              type: object
              additionalProperties: true
              properties:
                Name: { type: string }
                MaximumRetryCount: { type: integer }
        Mounts:
          type: [array, "null"]
          items:
            type: object
            additionalProperties: true
            properties:
              Type: { type: string }
              Name: { type: string }
              Source: { type: string }
              Destination: { type: string }
              Mode: { type: string }
              RW: { type: boolean }
        Config:
          type: [object, "null"]
          additionalProperties: true
          properties:
            Hostname: { type: string }
            User: { type: string }
            WorkingDir: { type: string }
            Env: { type: array, items: { type: string } }
            Cmd: { type: array, items: { type: string } }
            Entrypoint: { type: array, items: { type: string } }
            Labels: { type: object, additionalProperties: { type: string } }
        NetworkSettings:
          type: [object, "null"]
          additionalProperties: true
          properties:
            Ports:
              type: [object, "null"]
              additionalProperties:
                type: [array, "null"]
                items:
                  type: object
                  properties:
                    HostIp: { type: string }
                    HostPort: { type: string }
            Networks:
              type: [object, "null"]
              additionalProperties:
                type: object
                additionalProperties: true
                properties:
                  IPAddress: { type: string }
                  IPPrefixLen: { type: integer }
                  GlobalIPv6Address: { type: string }
                  MacAddress: { type: string }
    SystemInfo:
      type: object
      required: [id, hostname, operatingSystem, osType, architecture, kernelVersion, cpus,
        memoryBytes, cgroupDriver, cgroupVersion, rootless, snapshotter, snapshotters,
        logDrivers, securityOptions, features, components, cni, warnings, deprecations, plugins]
      properties:
        id: { type: string, description: containerd server UUID }
        hostname: { type: string }
        operatingSystem: { type: string, description: "Distribution, e.g. Ubuntu 24.04.2 LTS" }
        osType: { type: string, example: linux }
        architecture: { type: string, example: x86_64 }
        kernelVersion: { type: string }
        cpus: { type: integer }
        memoryBytes: { type: integer, format: int64 }
        cgroupDriver: { type: string, example: systemd }
        cgroupVersion: { type: string, example: "2" }
        rootless: { type: boolean }
        snapshotter: { type: string, description: nerdctl default snapshotter }
        snapshotters: { type: array, items: { type: string }, description: Snapshotters loaded by containerd }
        logDrivers: { type: array, items: { type: string } }
        securityOptions: { type: array, items: { type: string } }
        features:
          type: object
          required: [memoryLimit, swapLimit, cpuCfsPeriod, cpuCfsQuota, cpuShares, cpuSet,
            pidsLimit, oomKillDisable, ipv4Forwarding]
          properties:
            memoryLimit: { type: boolean }
            swapLimit: { type: boolean }
            cpuCfsPeriod: { type: boolean }
            cpuCfsQuota: { type: boolean }
            cpuShares: { type: boolean }
            cpuSet: { type: boolean }
            pidsLimit: { type: boolean }
            oomKillDisable: { type: boolean }
            ipv4Forwarding: { type: boolean }
        components:
          type: array
          description: containerd, runc and buildctl
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
              version: { type: string }
              commit: { type: string }
              error: { type: string, description: Why the version is unknown }
        cni:
          type: object
          required: [path, netConfPath, plugins]
          properties:
            path: { type: string, description: CNI plugin directory }
            netConfPath: { type: string }
            version: { type: string, description: Version of the bridge plugin }
            plugins: { type: array, items: { type: string } }
            error: { type: string }
        warnings: { type: array, items: { type: string } }
        deprecations:
          type: array
          items:
            type: object
            required: [id, message]
            properties:
              id: { type: string }
              message: { type: string }
              lastOccurrence: { type: string, format: date-time }
        plugins:
          type: array
          items:
            type: object
            required: [type, id, status]
            properties:
              type: { type: string, example: io.containerd.snapshotter.v1 }
              id: { type: string, example: overlayfs }
              platforms: { type: array, items: { type: string } }
              capabilities: { type: array, items: { type: string } }
              status: { type: string, enum: [ok, skip, error] }
              error: { type: string, description: Init error (also for skipped plugins) }
    LogLine:
      type: object
      required: [stream, line]
      properties:
        stream: { type: string, enum: [stdout, stderr] }
        ts:
          type: string
          format: date-time
          description: Absent when the log driver does not record times (journald)
        line: { type: string, description: Line without the newline; ANSI sequences preserved }
    ContainerActionName:
      type: string
      enum: [start, stop, restart, kill, pause, unpause, remove]
    BulkActionRequest:
      type: object
      required: [action, ids]
      additionalProperties: false
      properties:
        action: { $ref: "#/components/schemas/ContainerActionName" }
        ids:
          type: array
          minItems: 1
          maxItems: 200
          items: { type: string }
        force: { type: boolean, description: "remove only: kill running containers first" }
        volumes: { type: boolean, description: "remove only: also remove anonymous volumes" }
    BulkActionResult:
      type: object
      required: [id, ok]
      properties:
        id: { type: string }
        ok: { type: boolean }
        error: { $ref: "#/components/schemas/ErrorDetail" }

openapi: 3.1.0
info:
  title: nerdui API
  description: |
    HTTP API of nerdui — a web UI for nerdctl/containerd.

    This file is the source of truth for the API contract. TypeScript types for
    the frontend are generated from it (`make api-gen`); Go handlers must be kept
    in sync manually (see `internal/server`).
  version: 0.1.0
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: /
tags:
  - name: audit
    description: Audit log of user actions (#79)
  - name: notifications
    description: Notification channels (#86)
  - name: system
    description: Health and version information
  - name: auth
    description: First-run setup, login and sessions (ADR-0005)
  - name: environments
    description: Managed containerd hosts (ADR-0006); MVP has only "local"
  - name: containers
    description: Containers of an environment
  - name: images
    description: Images of an environment
  - name: stacks
    description: Compose stacks (#24–#31, ADR-0008)
  - name: git
    description: Git credentials and trusted SSH host keys of Git stacks (#37, #93, ADR-0039)
  - name: webhooks
    description: Incoming webhooks that redeploy or restart a stack or container (#85, #91, ADR-0041)
  - name: networks
    description: CNI networks (#60, ADR-0024)
  - name: volumes
    description: Named volumes (#57)
  - name: registries
    description: Registry logins of a host (#51, ADR-0019), shared with `nerdctl login`
  - name: jobs
    description: Background jobs for long operations (#126, ADR-0006, ADR-0018)
  - name: users
    description: Local users and their roles (#74, #78, ADR-0016, ADR-0058)
  - name: settings
    description: Per-environment settings such as the Prometheus connection (#176, ADR-0023)
security:
  - session: []
  - apiKey: []
paths:
  /healthz:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Server is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/version:
    get:
      tags: [system]
      operationId: getVersion
      summary: nerdui and runtime versions
      description: |
        Public. Build information, including the source URL required by AGPL-3.0
        section 13, is always returned. `runtime` and `error` are only included for
        authenticated requests. When containerd is unreachable, `runtime.containerd`
        is empty and `error` describes the problem.
      security: [{}, session: []]
      responses:
        "200":
          description: Version information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
  /api/v1/setup:
    get:
      tags: [auth]
      operationId: getSetupStatus
      summary: Whether the first admin account still has to be created
      security: []
      responses:
        "200":
          description: Setup status
          content:
            application/json:
              schema:
                type: object
                required: [required]
                properties:
                  required: { type: boolean }
    post:
      tags: [auth]
      operationId: setup
      summary: Create the first admin account using the setup token from the server log
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, username, password]
              additionalProperties: false
              properties:
                token: { type: string, description: One-time token printed to the server log }
                username: { type: string, pattern: "^[A-Za-z0-9._-]{1,64}$" }
                password: { type: string, minLength: 12, maxLength: 1024 }
      responses:
        "201":
          description: Admin created and logged in; sets the session cookie
          headers:
            Set-Cookie: { schema: { type: string }, description: "nerdui_session (HttpOnly, SameSite=Strict)" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in with username and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              additionalProperties: false
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          description: |
            Logged in and the session cookie set, or — for users with two-factor authentication —
            `mfaRequired` with a token for `POST /auth/login/mfa` (no session yet).
          headers:
            Set-Cookie: { schema: { type: string }, description: "nerdui_session (HttpOnly, SameSite=Strict)" }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SessionResponse"
                  - $ref: "#/components/schemas/MFAChallenge"
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/auth/login/mfa:
    post:
      tags: [auth]
      operationId: loginMFA
      summary: Complete a login with the second factor
      description: |
        #75, ADR-0037. `code` is the current authenticator code (each accepted once) or an unused
        backup code; or `passkey` is the browser's answer to the options of
        `POST /auth/login/mfa/passkey` (#226, ADR-0057). The token expires after 5 minutes or 5
        attempts.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfaToken]
              additionalProperties: false
              properties:
                mfaToken: { type: string }
                code: { type: string, examples: ["123456", "abcde-fghij"] }
                passkey: { $ref: "#/components/schemas/PasskeyCredential" }
      responses:
        "200":
          description: Logged in; sets the session cookie
          headers:
            Set-Cookie: { schema: { type: string }, description: "nerdui_session (HttpOnly, SameSite=Strict)" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/auth/login/mfa/passkey:
    post:
      tags: [auth]
      operationId: loginMFAPasskeyOptions
      summary: Options to answer the second step with a passkey
      description: "#226, ADR-0057. For `navigator.credentials.get()`; the answer goes to `POST /auth/login/mfa`."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfaToken]
              additionalProperties: false
              properties:
                mfaToken: { type: string }
      responses:
        "200":
          description: Options
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyOptions" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/auth/passkey/options:
    post:
      tags: [auth]
      operationId: passkeyLoginOptions
      summary: Options to sign in with a passkey, without a password
      description: |
        #226, ADR-0057. For `navigator.credentials.get()`: the browser offers the passkeys it has
        for this host. 409 when nerdui is opened by an IP address or over plain HTTP (except
        localhost), where browsers refuse passkeys.
      security: []
      responses:
        "200":
          description: Options and the token of the request (5 minutes, once)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyOptions" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/auth/passkey/login:
    post:
      tags: [auth]
      operationId: passkeyLogin
      summary: Sign in with a passkey
      description: The passkey verified the user (PIN, biometrics) and counts as both factors.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, credential]
              additionalProperties: false
              properties:
                token: { type: string }
                credential: { $ref: "#/components/schemas/PasskeyCredential" }
      responses:
        "200":
          description: Logged in; sets the session cookie
          headers:
            Set-Cookie: { schema: { type: string }, description: "nerdui_session (HttpOnly, SameSite=Strict)" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/auth/passkeys:
    get:
      tags: [auth]
      operationId: listPasskeys
      summary: Own passkeys
      description: "#226, ADR-0057. Requires a password session (not an API key)."
      responses:
        "200":
          description: Passkeys
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Passkey" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [auth]
      operationId: addPasskey
      summary: Add a passkey
      description: |
        `credential` is the browser's answer to the options of `POST /auth/passkeys/options`. The
        first second factor of a user also returns backup codes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, credential]
              additionalProperties: false
              properties:
                token: { type: string }
                name: { type: string, maxLength: 64, description: "Default: Passkey" }
                credential: { $ref: "#/components/schemas/PasskeyCredential" }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                type: object
                required: [passkey]
                properties:
                  passkey: { $ref: "#/components/schemas/Passkey" }
                  backupCodes: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/auth/passkeys/options:
    post:
      tags: [auth]
      operationId: passkeyRegisterOptions
      summary: Options to add a passkey
      description: |
        Checks the password and returns the options for `navigator.credentials.create()`. The
        passkey is bound to the host nerdui is opened by; 409 on an IP address or plain HTTP
        (except localhost), or at 20 passkeys.
      requestBody: { $ref: "#/components/requestBodies/PasswordConfirm" }
      responses:
        "200":
          description: Options and the token of the request (5 minutes, once)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyOptions" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/auth/passkeys/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    delete:
      tags: [auth]
      operationId: deletePasskey
      summary: Remove a passkey
      description: Without another second factor left, the backup codes are removed too.
      requestBody: { $ref: "#/components/requestBodies/PasswordConfirm" }
      responses:
        "204": { description: Removed }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/auth/mfa:
    get:
      tags: [auth]
      operationId: getMFA
      summary: Own two-factor authentication status
      description: "Requires a password session (not an API key)."
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MFAStatus" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/auth/mfa/setup:
    post:
      tags: [auth]
      operationId: setupMFA
      summary: Start two-factor setup
      description: Checks the password and returns a new secret; it is active once confirmed with `/auth/mfa/enable`.
      requestBody: { $ref: "#/components/requestBodies/PasswordConfirm" }
      responses:
        "200":
          description: Secret and otpauth URI (for a QR code)
          content:
            application/json:
              schema:
                type: object
                required: [secret, uri]
                properties:
                  secret: { type: string }
                  uri: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/auth/mfa/enable:
    post:
      tags: [auth]
      operationId: enableMFA
      summary: Confirm two-factor setup with a code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200": { $ref: "#/components/responses/BackupCodes" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/auth/mfa/backup-codes:
    post:
      tags: [auth]
      operationId: newBackupCodes
      summary: Replace the backup codes
      requestBody: { $ref: "#/components/requestBodies/PasswordConfirm" }
      responses:
        "200": { $ref: "#/components/responses/BackupCodes" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/auth/mfa/disable:
    post:
      tags: [auth]
      operationId: disableMFA
      summary: Turn the authenticator app off
      description: The backup codes stay while the user has passkeys.
      requestBody: { $ref: "#/components/requestBodies/PasswordConfirm" }
      responses:
        "204": { description: Disabled }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/users/{id}/mfa/reset:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      tags: [users]
      operationId: resetUserMFA
      summary: Turn off another user's two-factor authentication
      description: "Requires `users:write` (e.g. after a lost phone). Removes the authenticator app, the passkeys and the backup codes."
      responses:
        "204": { description: Reset }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/settings/oidc:
    get:
      tags: [settings]
      operationId: getOIDCSettings
      summary: Single sign-on settings
      description: Requires `settings:read` (#76). The client secret is never returned.
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OIDCSettings" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    put:
      tags: [settings]
      operationId: putOIDCSettings
      summary: Set the single sign-on settings
      description: |
        Requires `settings:write` (#76). When enabled, the issuer's discovery document must be
        reachable (400 otherwise). `clientSecret` replaces the stored secret, `""` removes it,
        and leaving it out keeps it; it is stored encrypted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OIDCSettings" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OIDCSettings" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/users/{id}/oidc:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    delete:
      tags: [users]
      operationId: unlinkUserOIDC
      summary: Unlink a user from their account at the single sign-on provider
      description: Requires `users:write` (#76). The next sign-in through the provider links again.
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDetail" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/settings/host-alerts:
    get:
      tags: [settings]
      operationId: getHostAlerts
      summary: Alert thresholds of host usage
      description: Requires `settings:read` (#64). Off by default.
      responses:
        "200":
          description: Thresholds
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HostAlerts" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    put:
      tags: [settings]
      operationId: putHostAlerts
      summary: Set the alert thresholds of host usage
      description: |
        Requires `settings:write` (#64, ADR-0054). A `host.alert` notification is sent when a
        usage stays at or above its percent for its minutes, and again when it falls 5 points
        below.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HostAlerts" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HostAlerts" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
  /api/v1/settings/security:
    get:
      tags: [settings]
      operationId: getSecuritySettings
      summary: Sign-in rules
      description: "Requires `settings:read`."
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecuritySettings" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    put:
      tags: [settings]
      operationId: putSecuritySettings
      summary: Set the sign-in rules
      description: |
        Requires `settings:write`. With `requireMfa`, sessions of users without two-factor
        authentication answer 403 `mfa_setup_required` everywhere except their own session and
        two-factor endpoints. API keys are not affected.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecuritySettings" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecuritySettings" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/auth/oidc:
    get:
      tags: [auth]
      operationId: getOIDCStatus
      summary: Whether single sign-on is enabled
      description: "#76, ADR-0056. For the sign-in page."
      security: []
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OIDCStatus" }
  /api/v1/auth/oidc/login:
    get:
      tags: [auth]
      operationId: startOIDCLogin
      summary: Sign in with the single sign-on provider
      description: |
        #76, ADR-0056. A browser navigation, not an API call: redirects to the provider with
        PKCE, a state kept in a cookie and a nonce. When it cannot start, answers with a page
        that goes to the sign-in page with `sso_error`.
      security: []
      parameters:
        - { name: redirect, in: query, schema: { type: string }, description: Path of the web UI to open after signing in }
      responses:
        "302": { description: To the provider }
        "200": { description: A page that goes back to the sign-in page with the reason }
  /api/v1/auth/oidc/callback:
    get:
      tags: [auth]
      operationId: finishOIDCLogin
      summary: Return from the single sign-on provider
      description: |
        #76, ADR-0056. Checks the state, exchanges the code and verifies the ID token. A user
        linked to the provider's account signs in; otherwise the account with the username
        claim as username is linked; otherwise, when `group` is set and the user is a member, an
        account is created. With `group` set, it is required in every case. Answers with a page
        that goes on to the web UI (the session cookie is SameSite=Strict), or to the sign-in
        page with `sso_error`.
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
      responses:
        "200": { description: A page that goes on to the web UI or back to the sign-in page }
  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Current user and CSRF token
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the current session
      description: Unsafe request — send the session's CSRF token in `X-CSRF-Token` (see the `session` security scheme).
      responses:
        "204": { description: Logged out; clears the session cookie }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/auth/password:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Change the caller's own password
      description: |
        Verifies the current password (rate limited), clears `mustChangePassword` and revokes
        the caller's other sessions. Available while a temporary password is pending.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              additionalProperties: false
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 12 }
      responses:
        "200":
          description: Changed; the current session stays valid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/auth/preferences:
    get:
      tags: [auth]
      operationId: getPreferences
      summary: The caller's interface preferences
      description: Requires `session:self` (#90). Defaults until the user saves their own.
      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Preferences" }
        "401": { $ref: "#/components/responses/Error" }
    put:
      tags: [auth]
      operationId: putPreferences
      summary: Save the caller's interface preferences
      description: Requires a password session (not an API key) (#90).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Preferences" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Preferences" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
  /api/v1/auth/api-keys:
    get:
      tags: [auth]
      operationId: listOwnAPIKeys
      summary: The caller's API keys
      description: Requires a password session (not an API key) (#87). Keys are never returned.
      responses:
        "200":
          description: Keys, newest first
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys: { type: array, items: { $ref: "#/components/schemas/APIKey" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [auth]
      operationId: createAPIKey
      summary: Create an API key
      description: |
        Requires a password session (#87, ADR-0028). The response contains the key; it is not
        shown again. At most 50 keys per user. `permissions` limits the key to chosen actions,
        none of which may exceed the caller's (#80, ADR-0053); requests are checked against
        both the key and its user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 64 }
                readOnly: { type: boolean }
                expiresAt: { type: string, format: date-time }
                permissions:
                  type: array
                  minItems: 1
                  items: { $ref: "#/components/schemas/Permission" }
                  description: Limit the key to these actions, each one the caller may perform (403 otherwise)
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/APIKey"
                  - type: object
                    required: [key]
                    properties:
                      key: { type: string, description: The secret key; shown once }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
  /api/v1/auth/api-keys/{key}:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      tags: [auth]
      operationId: deleteOwnAPIKey
      summary: Revoke one of the caller's API keys
      description: Requires a password session (#87).
      responses:
        "204": { description: Revoked }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/users/{id}/api-keys:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [users]
      operationId: listUserAPIKeys
      summary: API keys of a user
      description: Requires `users:read` (#87).
      responses:
        "200":
          description: Keys, newest first
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys: { type: array, items: { $ref: "#/components/schemas/APIKey" } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/users/{id}/api-keys/{key}:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - name: key
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      tags: [users]
      operationId: deleteUserAPIKey
      summary: Revoke an API key of a user
      description: Requires `users:write` (#87).
      responses:
        "204": { description: Revoked }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/users:
    get:
      tags: [users]
      operationId: listUsers
      summary: List users
      description: "Requires `users:read`."
      responses:
        "200":
          description: Users sorted by name
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users: { type: array, items: { $ref: "#/components/schemas/UserDetail" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [users]
      operationId: createUser
      summary: Create a user with a temporary password
      description: |
        Requires `users:write`. Without `password`, one is generated and returned once in
        `generatedPassword`. The user must change it at the first sign-in. The caller must have
        every permission of `role` (403 otherwise, ADR-0058); an unknown role is 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              additionalProperties: false
              properties:
                username: { type: string, pattern: "^[A-Za-z0-9._-]{1,64}$" }
                password: { type: string, minLength: 12 }
                role: { type: string, default: viewer, description: A built-in or custom role }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPasswordResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/roles:
    get:
      tags: [users]
      operationId: listRoles
      summary: List roles
      description: "Requires `users:read`. Built-in roles first, then custom roles by name (ADR-0058)."
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Role" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [users]
      operationId: createRole
      summary: Create a custom role
      description: "Requires `users:write` and every permission of the role."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/roles/{name}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    put:
      tags: [users]
      operationId: updateRole
      summary: Change a custom role
      description: |
        Requires `users:write` and every permission of the role before and after the change.
        Users with the role get the new permissions at their next request. Built-in roles
        cannot be changed (409).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleInput" }
      responses:
        "200":
          description: Changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [users]
      operationId: deleteRole
      summary: Delete a custom role
      description: "Requires `users:write`. A role that users have cannot be deleted (409)."
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/users/{id}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [users]
      operationId: getUser
      summary: Get a user
      description: "Requires `users:read`."
      responses:
        "200":
          description: User
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDetail" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [users]
      operationId: updateUser
      summary: Change the role of a user, or disable or enable them
      description: |
        Requires `users:write`. Disabling revokes the user's sessions. The caller's own account
        cannot be changed, and the last active administrator cannot be disabled or lose the
        admin role (409). The caller must have every permission of the user's current and new
        role (403 otherwise, ADR-0058). This applies to every change of another user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                disabled: { type: boolean }
                role: { type: string, description: A built-in or custom role }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDetail" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [users]
      operationId: deleteUser
      summary: Delete a user
      description: |
        Requires `users:write`. The caller's own account and the last active administrator
        cannot be deleted (409).
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/users/{id}/password:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [users]
      operationId: setUserPassword
      summary: Set a temporary password for another user
      description: |
        Requires `users:write`. Revokes the user's sessions; the user must change the password
        at the next sign-in. Without `password`, one is generated and returned once. Use
        `/auth/password` for your own account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                password: { type: string, minLength: 12 }
      responses:
        "200":
          description: Password set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPasswordResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/audit:
    get:
      tags: [audit]
      operationId: listAudit
      summary: Audit log
      description: |
        Requires `audit:read` (#79, ADR-0036). State-changing requests, terminal sessions,
        authorization denials, setup and logins, newest first. Request bodies are not recorded.
      parameters:
        - { name: user, in: query, schema: { type: string }, description: Exact username }
        - { name: result, in: query, schema: { type: string, enum: [ok, failed, denied, accepted] } }
        - { name: q, in: query, schema: { type: string }, description: Text in the path, object, action, message or user }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
        - { name: before, in: query, schema: { type: integer, format: int64 }, description: Entries older than this ID (paging) }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 500 } }
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEntry" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
  /api/v1/audit/export:
    get:
      tags: [audit]
      operationId: exportAudit
      summary: Export the audit log as CSV
      description: "Requires `audit:read`. All matching entries (up to 100000), newest first."
      parameters:
        - { name: user, in: query, schema: { type: string }, description: Exact username }
        - { name: result, in: query, schema: { type: string, enum: [ok, failed, denied, accepted] } }
        - { name: q, in: query, schema: { type: string }, description: Text in the path, object, action, message or user }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
  /api/v1/notifications/channels:
    get:
      tags: [notifications]
      operationId: listNotificationChannels
      summary: Notification channels
      description: "Requires `settings:read` (#86, ADR-0034). Secrets are never returned; `secrets` names those set."
      responses:
        "200":
          description: Channels and the event kinds they can subscribe to
          content:
            application/json:
              schema:
                type: object
                required: [channels, kinds]
                properties:
                  channels:
                    type: array
                    items: { $ref: "#/components/schemas/NotificationChannel" }
                  kinds:
                    type: array
                    items: { $ref: "#/components/schemas/NotificationKind" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
    post:
      tags: [notifications]
      operationId: createNotificationChannel
      summary: Add a notification channel
      description: "Requires `settings:write`."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationChannelInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationChannel" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
  /api/v1/notifications/channels/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      tags: [notifications]
      operationId: updateNotificationChannel
      summary: Replace a notification channel
      description: "Requires `settings:write`. Empty secrets keep the stored ones while the type is unchanged."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationChannelInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationChannel" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
    delete:
      tags: [notifications]
      operationId: deleteNotificationChannel
      summary: Remove a notification channel
      description: "Requires `settings:write`."
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
  /api/v1/notifications/test:
    post:
      tags: [notifications]
      operationId: testNotificationChannel
      summary: Send a test message
      description: |
        Requires `settings:write`. Sends through the given settings, saved or not; with `id`, empty
        secrets come from that channel. 502 when the channel refused the message.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/NotificationChannelInput"
                - type: object
                  properties:
                    id: { type: integer, format: int64 }
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema:
                type: object
                required: [sent]
                properties:
                  sent: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /api/v1/backup:
    post:
      tags: [settings]
      operationId: createBackup
      summary: Download a backup of nerdui's data
      description: |
        Requires `settings:write` (#89, ADR-0047). An archive of the database (users, settings,
        credentials, stacks, webhooks, …), the managed stacks and the Git stacks, encrypted with
        the password (age, scrypt). Restore it with `nerdui admin restore` on a stopped nerdui.
        Container data and volumes are not included.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              additionalProperties: false
              properties:
                password: { type: string, minLength: 12, writeOnly: true }
      responses:
        "200":
          description: Encrypted archive
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/schedules:
    get:
      tags: [settings]
      operationId: listSchedules
      summary: Scheduled jobs
      description: Requires `settings:read` (#82, ADR-0048).
      responses:
        "200":
          description: Schedules
          content:
            application/json:
              schema:
                type: object
                required: [schedules]
                properties:
                  schedules: { type: array, items: { $ref: "#/components/schemas/Schedule" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [settings]
      operationId: createSchedule
      summary: Create a schedule
      description: |
        Requires `settings:write`. Cron expressions have five fields (minute hour day month
        weekday) or are descriptors such as `@daily` or `@every 6h`, in the server's time zone.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/schedules/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    put:
      tags: [settings]
      operationId: updateSchedule
      summary: Change a schedule
      description: Requires `settings:write`. An empty `password` keeps a backup's stored password.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [settings]
      operationId: deleteSchedule
      summary: Delete a schedule and its history
      description: Requires `settings:write`.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/schedules/{id}/run:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      tags: [settings]
      operationId: runSchedule
      summary: Run a schedule now
      description: Requires `settings:write`. Also for disabled schedules; 409 while its previous run is not finished.
      responses:
        "202":
          description: Started
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/schedules/{id}/runs:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [settings]
      operationId: listScheduleRuns
      summary: The last 50 runs of a schedule
      description: Requires `settings:read`.
      responses:
        "200":
          description: Runs, newest first
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs: { type: array, items: { $ref: "#/components/schemas/ScheduleRun" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/variables:
    get:
      tags: [settings]
      operationId: listGlobalVariables
      summary: Global variables of all stacks
      description: |
        Requires `settings:read` (#35, ADR-0049). Global variables are passed to every stack's
        `nerdctl compose`; a stack's own variable of the same name wins. Secret values are empty.
      responses:
        "200": { $ref: "#/components/responses/Variables" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/variables/{var}:
    parameters:
      - $ref: "#/components/parameters/VariableName"
    put:
      tags: [settings]
      operationId: putGlobalVariable
      summary: Create or change a global variable
      description: Requires `settings:write`.
      requestBody: { $ref: "#/components/requestBodies/VariableInput" }
      responses:
        "200": { $ref: "#/components/responses/Variable" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    delete:
      tags: [settings]
      operationId: deleteGlobalVariable
      summary: Delete a global variable
      description: Requires `settings:write`.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/backup-targets:
    get:
      tags: [settings]
      operationId: listBackupTargets
      summary: Targets of volume backups
      description: Requires `settings:read` (#59, ADR-0050). Secret keys are never returned.
      responses:
        "200":
          description: Targets
          content:
            application/json:
              schema:
                type: object
                required: [targets]
                properties:
                  targets: { type: array, items: { $ref: "#/components/schemas/BackupTarget" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [settings]
      operationId: createBackupTarget
      summary: Add a backup target (host directory or S3 bucket)
      description: Requires `settings:write`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupTargetInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupTarget" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/backup-targets/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    put:
      tags: [settings]
      operationId: updateBackupTarget
      summary: Change a backup target
      description: Requires `settings:write`. An empty `secretKey` keeps the stored one.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupTargetInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupTarget" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [settings]
      operationId: deleteBackupTarget
      summary: Delete a backup target; its archives stay
      description: Requires `settings:write`. Refused while schedules use it.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/backup-targets/{id}/test:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      tags: [settings]
      operationId: testBackupTarget
      summary: Write, list and delete a small object in a target
      description: Requires `settings:write`.
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  error: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/templates:
    get:
      tags: [stacks]
      operationId: listTemplates
      summary: Stack templates
      description: |
        Requires `stacks:read` (#33, #34, ADR-0051): the built-in catalog, saved templates and
        those of the configured registries; registries that cannot be read are listed in
        `errors`.
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                type: object
                required: [templates, errors]
                properties:
                  templates: { type: array, items: { $ref: "#/components/schemas/TemplateSummary" } }
                  errors:
                    type: array
                    items:
                      type: object
                      required: [source, error]
                      properties:
                        source: { type: string }
                        error: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [stacks]
      operationId: createTemplate
      summary: Save a stack template
      description: Requires `stacks:write`.
      requestBody: { $ref: "#/components/requestBodies/TemplateInput" }
      responses:
        "201": { $ref: "#/components/responses/Template" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/templates/detail:
    get:
      tags: [stacks]
      operationId: getTemplate
      summary: A template with its compose file and variables
      description: Requires `stacks:read`. Files of registry templates are fetched when linked.
      parameters:
        - { name: source, in: query, required: true, schema: { type: string }, description: "builtin, custom or a registry URL" }
        - { name: id, in: query, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Template" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/templates/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      tags: [stacks]
      operationId: updateTemplate
      summary: Change a saved template
      description: Requires `stacks:write`.
      requestBody: { $ref: "#/components/requestBodies/TemplateInput" }
      responses:
        "200": { $ref: "#/components/responses/Template" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [stacks]
      operationId: deleteTemplate
      summary: Delete a saved template
      description: Requires `stacks:write`.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/template-registries:
    get:
      tags: [settings]
      operationId: getTemplateRegistries
      summary: URLs of registry.json template catalogs
      description: Requires `settings:read`.
      responses:
        "200": { $ref: "#/components/responses/TemplateRegistries" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    put:
      tags: [settings]
      operationId: putTemplateRegistries
      summary: Replace the template registries
      description: Requires `settings:write`. http(s) URLs, at most 20.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [urls]
              additionalProperties: false
              properties:
                urls: { type: array, items: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/TemplateRegistries" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/webhooks:
    get:
      tags: [webhooks]
      operationId: listWebhooks
      summary: Incoming webhooks
      description: Requires `settings:read`. Tokens are never returned.
      responses:
        "200":
          description: Webhooks
          content:
            application/json:
              schema:
                type: object
                required: [webhooks]
                properties:
                  webhooks:
                    type: array
                    items: { $ref: "#/components/schemas/Webhook" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
    post:
      tags: [webhooks]
      operationId: createWebhook
      summary: Create an incoming webhook
      description: |
        Requires `settings:write`. The response has the URL path with the secret token, shown only
        once (nerdui stores its hash). The target is not checked now: a call fails when it is
        missing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [webhook, path]
                properties:
                  webhook: { $ref: "#/components/schemas/Webhook" }
                  path: { type: string, example: /api/v1/hooks/3q2-7wE... }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
  /api/v1/webhooks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      tags: [webhooks]
      operationId: updateWebhook
      summary: Change an incoming webhook
      description: Requires `settings:write`. The token and URL stay.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
    delete:
      tags: [webhooks]
      operationId: deleteWebhook
      summary: Delete an incoming webhook
      description: Requires `settings:write`.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
  /api/v1/webhooks/{id}/token:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [webhooks]
      operationId: newWebhookToken
      summary: Replace the URL of a webhook
      description: Requires `settings:write`. Returns the new path, shown once; the previous URL stops working.
      responses:
        "200":
          description: New URL
          content:
            application/json:
              schema:
                type: object
                required: [path]
                properties:
                  path: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
  /api/v1/hooks/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [webhooks]
      operationId: callWebhook
      summary: Call an incoming webhook
      description: |
        Public: the secret token in the path is the credential (#85, #91, ADR-0041). Runs the
        webhook's action as a job of the user `webhook <name>`; the body is ignored.
        A redeploy of a stack runs `compose pull` and `compose up`. A redeploy of a container
        pulls its image and recreates it with the same settings: it fails if the container has
        settings that recreating would lose. A restart restarts the stack or container as it
        is. The response comes when the job has started, not when it is done.
        Errors:
        - 404 for unknown or disabled webhooks;
        - 409 when the target is missing or a job runs for it;
        - 503 in read-only mode.
      security: []
      responses:
        "202":
          description: The job started
          content:
            application/json:
              schema:
                type: object
                required: [status, job]
                properties:
                  status: { type: string, enum: [accepted] }
                  job: { type: string, description: ID of the job }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/git/credentials:
    get:
      tags: [git]
      operationId: listGitCredentials
      summary: Git credentials
      description: "Requires `stacks:read` (#93, ADR-0039), so stack authors can pick one. Secrets are never returned."
      responses:
        "200":
          description: Credentials
          content:
            application/json:
              schema:
                type: object
                required: [credentials]
                properties:
                  credentials:
                    type: array
                    items: { $ref: "#/components/schemas/GitCredential" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
    post:
      tags: [git]
      operationId: createGitCredential
      summary: Save a Git credential
      description: "Requires `settings:write`. With `generate`, a new ed25519 SSH key is created; add its `publicKey` as a deploy key."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GitCredentialInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitCredential" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
  /api/v1/git/credentials/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      tags: [git]
      operationId: updateGitCredential
      summary: Replace a Git credential
      description: "Requires `settings:write`. An empty `secret` keeps the stored secret and passphrase while the kind is unchanged. Stacks use the new value on their next pull."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GitCredentialInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitCredential" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
    delete:
      tags: [git]
      operationId: deleteGitCredential
      summary: Remove a Git credential
      description: "Requires `settings:write`. Refused (409) while a Git stack uses it."
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
  /api/v1/git/known-hosts:
    get:
      tags: [git]
      operationId: listGitKnownHosts
      summary: Trusted SSH host keys
      description: "Requires `settings:read`. The first key a Git server presents is trusted; later connections must present the same key."
      responses:
        "200":
          description: Host keys
          content:
            application/json:
              schema:
                type: object
                required: [hosts]
                properties:
                  hosts:
                    type: array
                    items: { $ref: "#/components/schemas/GitKnownHost" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
    delete:
      tags: [git]
      operationId: forgetGitKnownHost
      summary: Forget the keys of a host
      description: "Requires `settings:write`. The next connection trusts the key the host presents: do this only when the key change is expected."
      parameters:
        - name: host
          in: query
          required: true
          schema: { type: string, example: "github.com:22" }
      responses:
        "204": { description: Forgotten }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
  /api/v1/jobs:
    get:
      tags: [jobs]
      operationId: listJobs
      summary: Recent background jobs, newest first
      description: |
        Requires `jobs:read`; only jobs whose action the caller is allowed are listed. Jobs are
        kept in memory: the last 100, finished ones for an hour (ADR-0018).
      responses:
        "200":
          description: Jobs
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs: { type: array, items: { $ref: "#/components/schemas/Job" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/jobs/{id}:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      tags: [jobs]
      operationId: getJob
      summary: A background job
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/jobs/{id}/stream:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      tags: [jobs]
      operationId: streamJob
      summary: Job state and terminal output (WebSocket)
      description: |
        WebSocket stream (ADR-0007). Data messages are `JobFrame`s: the first has `reset` with
        the job and its stored output (the terminal screen with progress redraws applied);
        later ones carry raw output as written and state changes. The stream ends with `end`
        after the final state. A client that falls behind gets an error and reconnects.
      responses:
        "101": { description: Switching protocols }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/jobs/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      tags: [jobs]
      operationId: cancelJob
      summary: Cancel a running job
      description: Ends the job with status `canceled`; a no-op for finished jobs.
      responses:
        "202":
          description: Cancellation requested
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/environments:
    get:
      tags: [environments]
      operationId: listEnvironments
      summary: List managed environments
      description: "Requires `system:read`."
      responses:
        "200":
          description: Environments
          content:
            application/json:
              schema:
                type: object
                required: [environments]
                properties:
                  environments:
                    type: array
                    items: { $ref: "#/components/schemas/Environment" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/compose-schema:
    get:
      tags: [stacks]
      operationId: getComposeSchema
      summary: The Compose JSON schema of this build
      description: Requires `stacks:read` (#26). The schema compose-go embeds, for editor completion.
      responses:
        "200":
          description: JSON schema
          content:
            application/schema+json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}:
    parameters:
      - $ref: "#/components/parameters/Env"
    get:
      tags: [environments]
      operationId: getEnvironment
      summary: Environment with live connectivity status and runtime versions
      description: "Requires `system:read`. Always 200 for a known environment; `status` tells whether containerd is reachable."
      responses:
        "200":
          description: Environment status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvironmentStatus" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/info:
    parameters:
      - $ref: "#/components/parameters/Env"
    get:
      tags: [environments]
      operationId: getEnvironmentInfo
      summary: Host and runtime information
      description: |
        Like `nerdctl info` and `nerdctl version`, plus containerd plugins (`ctr plugins ls`)
        and CNI plugins (#66, ADR-0015). Host fields describe the machine nerdui runs on.
        Requires `system:read`.
      responses:
        "200":
          description: Host and runtime information
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemInfo" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/namespaces:
    parameters:
      - $ref: "#/components/parameters/Env"
    get:
      tags: [environments]
      operationId: listNamespaces
      summary: containerd namespaces of the environment
      description: "Requires `namespaces:read`."
      responses:
        "200":
          description: Namespaces, sorted
          content:
            application/json:
              schema:
                type: object
                required: [namespaces, default]
                properties:
                  namespaces:
                    type: array
                    items: { type: string }
                  default: { type: string, description: Default namespace of the environment }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    post:
      tags: [environments]
      operationId: createNamespace
      summary: Create a namespace
      description: |
        Requires `namespaces:write`; refused (503) in read-only mode. The name follows
        containerd's identifier rules (letters, digits, `_`, `.`, `-`; up to 76 characters).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NamespaceSpec" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NamespaceSpec" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/namespaces/{name}:
    parameters:
      - $ref: "#/components/parameters/Env"
      - name: name
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [environments]
      operationId: removeNamespace
      summary: Remove an empty namespace
      description: |
        Requires `namespaces:write`; refused (503) in read-only mode. Refused (409) while the
        namespace holds containers, images, volumes or user-defined networks (the message names
        them), or anything containerd still keeps there (content, snapshots, leases).
      responses:
        "204": { description: Removed }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/events:
    parameters:
      - $ref: "#/components/parameters/Env"
    get:
      tags: [environments]
      operationId: listEvents
      summary: Recorded events, newest first
      description: |
        Requires `system:read` (#65, ADR-0021). Events are recorded while nerdui runs and kept for
        `--events-retention` (default 7 days, at most 100 000). `recording` is false when the
        history is disabled. Page with `before` = id of the oldest event shown.
      parameters:
        - name: namespace
          in: query
          schema: { type: string }
          description: containerd namespace; empty = the environment's default, `*` = all
        - name: kind
          in: query
          schema: { type: string, examples: ["container", "task", "image"] }
        - name: object
          in: query
          schema: { type: string }
          description: Container ID or name, image name
        - name: before
          in: query
          schema: { type: integer, format: int64 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: object
                required: [events, recording]
                properties:
                  events: { type: array, items: { $ref: "#/components/schemas/HistoryEvent" } }
                  more: { type: boolean, description: Older events exist }
                  recording: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/events/stream:
    parameters:
      - $ref: "#/components/parameters/Env"
    get:
      tags: [environments]
      operationId: streamEvents
      summary: containerd events (WebSocket)
      description: |
        WebSocket stream (ADR-0007); requires `system:read` and a same-origin upgrade.
        Text frames carry `StreamMessage` envelopes whose `data` is an `Event`. The first
        message is the connection state (`kind: nerdui`, `action: connected|disconnected`);
        clients refetch their data on `connected` because events missed during an outage are
        not replayed. A client that falls behind is closed with code 1013 and should reconnect.
      parameters:
        - name: namespace
          in: query
          schema: { type: string }
          description: containerd namespace; empty = environment default, `*` = all namespaces
        - name: topics
          in: query
          schema: { type: string, examples: ["/containers/,/tasks/"] }
          description: Comma-separated topic prefixes; empty = all topics
      responses:
        "101": { description: Switching protocols (WebSocket) }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/containers:
    parameters:
      - $ref: "#/components/parameters/Env"
      - $ref: "#/components/parameters/Namespace"
    get:
      tags: [containers]
      operationId: listContainers
      summary: All containers of a namespace (any state), newest first
      description: |
        Requires `containers:read`. Filtering and sorting are done by clients (ADR-0006).
        Live updates: refetch on events from `/events/stream`.
      responses:
        "200":
          description: Containers
          content:
            application/json:
              schema:
                type: object
                required: [namespace, containers]
                properties:
                  namespace: { type: string }
                  containers:
                    type: array
                    items: { $ref: "#/components/schemas/Container" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    post:
      tags: [containers]
      operationId: createContainer
      summary: Create (and start) a container (background job)
      description: |
        Requires `containers:write` and a compatible host nerdctl (#17, ADR-0003). The job pulls
        the image when it is missing, runs the host's `nerdctl create` with arguments built from
        the typed spec (no shell) and starts the container when `start` is set; its `result`
        has `containerId`. Invalid specs answer 400 before a job starts.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateContainerRequest" }
      responses:
        "202":
          description: Job started
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/containers/command:
    parameters:
      - $ref: "#/components/parameters/Env"
    post:
      tags: [containers]
      operationId: containerCommand
      summary: The nerdctl command equivalent to a create request
      description: "Requires `containers:write`. `nerdctl run -d …`, or `nerdctl create …` without `start`."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateContainerRequest" }
      responses:
        "200":
          description: Shell-quoted command
          content:
            application/json:
              schema:
                type: object
                required: [command]
                properties:
                  command: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/images:
    parameters:
      - $ref: "#/components/parameters/Env"
      - $ref: "#/components/parameters/Namespace"
    get:
      tags: [images]
      operationId: listImages
      summary: All images of a namespace, sorted by name
      description: |
        Requires `images:read` (#42). One entry per stored reference; sizes cover every platform
        in the store. Filtering and sorting are done by clients (ADR-0006). Live updates: refetch
        on events from `/events/stream`.
      responses:
        "200":
          description: Images
          content:
            application/json:
              schema:
                type: object
                required: [namespace, images]
                properties:
                  namespace: { type: string }
                  images:
                    type: array
                    items: { $ref: "#/components/schemas/Image" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/images/history:
    parameters:
      - $ref: "#/components/parameters/Env"
      - $ref: "#/components/parameters/Namespace"
    get:
      tags: [images]
      operationId: imageHistory
      summary: History of an image
      description: |
        Requires `images:read`. The build steps of an image, newest first, like
        `nerdctl image history` (#47). The size of a layer is its unpacked size on disk, or the
        compressed size from the registry (`compressed`) when the image is not unpacked.
      parameters:
        - name: ref
          in: query
          required: true
          description: Image name as listed, e.g. docker.io/library/nginx:1.27
          schema: { type: string }
      responses:
        "200":
          description: History
          content:
            application/json:
              schema:
                type: object
                required: [history]
                properties:
                  history:
                    type: array
                    items: { $ref: "#/components/schemas/ImageHistoryEntry" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/images/save:
    parameters:
      - $ref: "#/components/parameters/Env"
      - $ref: "#/components/parameters/Namespace"
    get:
      tags: [images]
      operationId: saveImages
      summary: Download images as a tar archive
      description: |
        Requires `images:write` (#46). The images for the host's platform as one tar archive,
        like `nerdctl save`; `nerdctl load` and `docker load` read it. Also available in
        read-only mode. A failure after the archive started aborts the connection.
      parameters:
        - name: ref
          in: query
          required: true
          description: Image names as listed, e.g. docker.io/library/nginx:1.27 (1 to 50)
          schema: { type: array, items: { type: string }, minItems: 1, maxItems: 50 }
          style: form
          explode: true
      responses:
        "200":
          description: Tar archive
          headers:
            Content-Disposition: { schema: { type: string }, description: 'attachment; filename="nginx_1.27.tar"' }
          content:
            application/x-tar:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/images/load:
    parameters:
      - $ref: "#/components/parameters/Env"
      - $ref: "#/components/parameters/Namespace"
    post:
      tags: [images]
      operationId: loadImages
      summary: Load images from a tar archive
      description: |
        Requires `images:write` and a compatible host nerdctl (#46). Imports the images of an
        archive from `nerdctl save` or `docker save` (optionally gzip-compressed) for the host's
        platform and unpacks them, like `nerdctl load`. Images without a name are named
        `import-<date>@<digest>`. Returns the images created or updated.
      requestBody:
        required: true
        content:
          application/x-tar:
            schema: { type: string, format: binary }
          application/gzip:
            schema: { type: string, format: binary }
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Loaded images
          content:
            application/json:
              schema:
                type: object
                required: [images]
                properties:
                  images: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/images/pull:
    parameters:
      - $ref: "#/components/parameters/Env"
      - $ref: "#/components/parameters/Namespace"
    post:
      tags: [images]
      operationId: pullImage
      summary: Pull an image (background job)
      description: |
        Requires `images:write` and a compatible host nerdctl (ADR-0011). Starts a job like
        `nerdctl pull` (always contacts the registry) and answers 202; follow it at
        `/jobs/{id}/stream`. One pull per reference and namespace runs at a time (409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reference]
              additionalProperties: false
              properties:
                reference: { type: string, examples: ["nginx:1.27"] }
                platform: { type: string, description: "e.g. linux/arm64; default: host platform" }
                allPlatforms: { type: boolean, description: Pull every platform (no unpack) }
      responses:
        "202":
          description: Job started
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/images/push:
    parameters:
      - $ref: "#/components/parameters/Env"
      - $ref: "#/components/parameters/Namespace"
    post:
      tags: [images]
      operationId: pushImage
      summary: Push an image (background job)
      description: |
        Requires `images:write` (#44). Starts a job like `nerdctl push` with the registry
        configuration and credentials of the host (docker config); answers 202. Pull and push
        of the same reference share one lock (409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reference]
              additionalProperties: false
              properties:
                reference: { type: string, examples: ["registry.local:5000/app:1"] }
                platform: { type: string, description: "e.g. linux/arm64; default: host platform" }
                allPlatforms: { type: boolean }
      responses:
        "202":
          description: Job started
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/images/tag:
    parameters:
      - $ref: "#/components/parameters/Env"
      - $ref: "#/components/parameters/Namespace"
    post:
      tags: [images]
      operationId: tagImage
      summary: Add a reference to an image
      description: Requires `images:write`. Like `nerdctl tag`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source, target]
              additionalProperties: false
              properties:
                source: { type: string, examples: ["nginx:1.27"] }
                target: { type: string, examples: ["registry.local:5000/nginx:1.27"] }
      responses:
        "204": { description: Tagged }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/images/remove:
    parameters:
      - $ref: "#/components/parameters/Env"
      - $ref: "#/components/parameters/Namespace"
    post:
      tags: [images]
      operationId: removeImages
      summary: Remove image references
      description: |
        Requires `images:write`. Like `nerdctl rmi`, one reference after another; each result
        reports success or the error. Without `force`, images used by containers are refused
        (`conflict`); with `force`, images of running containers are only untagged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [references]
              additionalProperties: false
              properties:
                references: { type: array, items: { type: string }, minItems: 1, maxItems: 200 }
                force: { type: boolean }
      responses:
        "200":
          description: Results in request order
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [reference, ok]
                      properties:
                        reference: { type: string }
                        ok: { type: boolean }
                        error: { $ref: "#/components/schemas/ErrorDetail" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/system/prune:
    parameters:
      - $ref: "#/components/parameters/Env"
      - $ref: "#/components/parameters/Namespace"
    get:
      tags: [environments]
      operationId: prunePreview
      summary: Estimate what a prune removes
      description: |
        Requires `system:read` (#52, ADR-0020). Images are selected exactly as the prune does
        (dangling, or all unused with `allImages`); containers are those stopped now; networks
        and build cache are not previewed. Image sizes overlap where layers are shared.
      parameters:
        - name: allImages
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrunePreview" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    post:
      tags: [environments]
      operationId: prune
      summary: Remove unused resources (background job)
      description: |
        Requires `system:prune` and a compatible host nerdctl. Runs nerdctl's container, network,
        image and build cache prunes in the order of `nerdctl system prune`; volumes are never
        pruned. One prune per namespace at a time (409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                containers: { type: boolean, description: Stopped containers }
                images: { type: boolean, description: Dangling images }
                allImages: { type: boolean, description: "With images: all images no container uses; also all build cache" }
                networks: { type: boolean, description: Networks no container uses (not bridge, host, none) }
                buildCache: { type: boolean, description: BuildKit cache (skipped without a BuildKit daemon) }
      responses:
        "202":
          description: Job started
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/stacks:
    parameters:
      - $ref: "#/components/parameters/Env"
      - $ref: "#/components/parameters/Namespace"
    post:
      tags: [stacks]
      operationId: createStack
      summary: Create a stack in the stacks directory
      description: |
        Requires `stacks:write` (#26). Creates `<stacks-dir>/<name>/compose.yaml` with `compose`
        (a starter file when empty), optionally with an `.env` file and variables of the stack
        (#35), as deploying a template does (#33). Content that does not load is refused (400)
        and nothing is left behind.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { type: string }
                compose: { type: string }
                env: { type: string, description: Content of the stack's .env file }
                variables:
                  type: array
                  description: Variables of the stack; secrets are encrypted and never returned
                  items:
                    type: object
                    required: [name, value]
                    additionalProperties: false
                    properties:
                      name: { type: string }
                      value: { type: string }
                      secret: { type: boolean }
      responses:
        "201":
          description: The new stack
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stack" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
    get:
      tags: [stacks]
      operationId: listStacks
      summary: Compose stacks with their status in a namespace
      description: |
        Requires `stacks:read` (#24, ADR-0008). Stacks in --stacks-dir (`managed`), registered
        external directories (`external`) and compose projects known only from container labels
        (`unmanaged`). Status compares the services of the compose file (loaded like
        `nerdctl compose`) with the running containers of the project.
      responses:
        "200":
          description: Stacks sorted by name, unmanaged last
          content:
            application/json:
              schema:
                type: object
                required: [namespace, stacks]
                properties:
                  namespace: { type: string }
                  stacks: { type: array, items: { $ref: "#/components/schemas/Stack" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/stack-candidates:
    parameters:
      - $ref: "#/components/parameters/Env"
    get:
      tags: [stacks]
      operationId: listStackCandidates
      summary: Compose projects in the scan directories that are not stacks yet
      description: |
        Requires `stacks:read` (#25). Scans `--stacks-scan-dirs` two levels deep. `localPaths`
        lists files of the project directory the project uses (bind mounts, build contexts, env
        files, configs, secrets): such a project can only be adopted in place.
      responses:
        "200":
          description: Candidates sorted by path
          content:
            application/json:
              schema:
                type: object
                required: [candidates]
                properties:
                  scanDirs: { type: [array, "null"], items: { type: string } }
                  candidates:
                    type: array
                    items:
                      type: object
                      required: [name, path, composeFile, services, taken]
                      properties:
                        name: { type: string }
                        path: { type: string }
                        composeFile: { type: string }
                        services: { type: array, items: { type: string } }
                        localPaths: { type: array, items: { type: string } }
                        error: { type: string }
                        taken: { type: boolean, description: A stack of that name exists }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/stacks/adopt:
    parameters:
      - $ref: "#/components/parameters/Env"
      - $ref: "#/components/parameters/Namespace"
    post:
      tags: [stacks]
      operationId: adoptStack
      summary: Adopt an existing compose project as a stack
      description: |
        Requires `stacks:write` (#25, ADR-0008). `in-place` registers the directory; `copy`
        copies its compose and .env files into the stacks directory and is refused (409) when the
        project uses other files of its directory. The containers keep running.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, path, mode]
              additionalProperties: false
              properties:
                name: { type: string }
                path: { type: string, description: Absolute directory with a compose file }
                mode: { type: string, enum: [in-place, copy] }
      responses:
        "201":
          description: The new stack
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stack" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/stacks/git:
    parameters:
      - $ref: "#/components/parameters/Env"
      - $ref: "#/components/parameters/Namespace"
    post:
      tags: [stacks]
      operationId: createGitStack
      summary: Create a stack from a Git repository
      description: |
        Requires `stacks:write`, and `stacks:deploy` with `deploy` (#37, ADR-0039). Checks the
        request (400, 409 when the name is taken), then clones the ref with depth 1 into the
        data directory as a job; with `deploy`, `compose up` follows. SSH URLs need an SSH key
        credential. The job's `result.stack` is the stack name.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GitStackRequest" }
      responses:
        "202":
          description: Job started
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/stacks/{name}/git/pull:
    parameters:
      - $ref: "#/components/parameters/Env"
      - $ref: "#/components/parameters/Namespace"
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [stacks]
      operationId: pullGitStack
      summary: Pull a Git stack
      description: |
        Requires `stacks:deploy`. Fetches the stack's ref and checks out its newest commit as a
        job; untracked files such as `.env` stay. With `redeploy`, `compose up --remove-orphans`
        follows when the commit changed, or always with `force`. A failure is kept in
        `git.lastError` and the previous commit stays checked out. The job's `result.commit` is
        the checked-out commit.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                redeploy: { type: boolean }
                force: { type: boolean, description: Redeploy even when the commit did not change }
                pull: { type: boolean, description: Pull images before redeploying }
      responses:
        "202":
          description: Job started
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/stacks/{name}/git:
    parameters:
      - $ref: "#/components/parameters/Env"
      - $ref: "#/components/parameters/Namespace"
      - name: name
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [stacks]
      operationId: removeGitStack
      summary: Remove a Git stack
      description: |
        Requires `stacks:write`. Forgets the stack and deletes its clone, `.env` included.
        `confirm` must equal the stack name; refused (409) while the stack has containers in the
        namespace or a job runs for it.
      parameters:
        - name: confirm
          in: query
          required: true
          schema: { type: string }
      responses:
        "204": { description: Removed }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/stacks/{name}/git/auto:
    parameters:
      - $ref: "#/components/parameters/Env"
      - name: name
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [stacks]
      operationId: setGitStackAuto
      summary: Automatic updates of a Git stack
      description: |
        Requires `stacks:deploy`. Sets what happens when polling or the webhook finds a new commit
        (#38, #39): `off`, `notify` (a `git.update` notification) or `deploy` (pull, then
        `compose up --remove-orphans` in every namespace where the project has containers; a
        stack without containers is only pulled). `pollInterval` is one of 0 (no polling), 60,
        300, 900, 3600, 21600 or 86400 seconds.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GitAutoRequest" }
      responses:
        "204": { description: Saved }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/stacks/{name}/git/webhook:
    parameters:
      - $ref: "#/components/parameters/Env"
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [stacks]
      operationId: createGitStackWebhook
      summary: Create or replace the webhook of a Git stack
      description: |
        Requires `stacks:deploy`. Returns the webhook path with a new secret token, shown only
        once (nerdui stores its hash); a previous token stops working.
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [path]
                properties:
                  path: { type: string, example: /api/v1/hooks/git/3q2-7wE... }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
    delete:
      tags: [stacks]
      operationId: deleteGitStackWebhook
      summary: Remove the webhook of a Git stack
      description: Requires `stacks:deploy`.
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
  /api/v1/hooks/git/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [git]
      operationId: gitStackWebhook
      summary: Push webhook of a Git stack
      description: |
        Public: the secret token in the path is the credential (#38, ADR-0040). Point a push
        webhook of GitHub, GitLab, Gitea or any CI here. A JSON body with a `ref` other than the
        stack's ref is ignored, as are events other than pushes (`X-GitHub-Event`,
        `X-Gitea-Event`, `X-Gitlab-Event`); GitHub's `ping` answers `pong`. Otherwise the remote
        is checked in the background and a new commit is announced or deployed according to the
        stack's automatic update setting; 409 while it is `off`.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ref: { type: string, example: refs/heads/main }
      responses:
        "200":
          description: Ignored, or a ping
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitWebhookResult" }
        "202":
          description: The check started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitWebhookResult" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/stacks/{name}/services/{service}/{op}:
    parameters:
      - $ref: "#/components/parameters/Env"
      - $ref: "#/components/parameters/Namespace"
      - name: name
        in: path
        required: true
        schema: { type: string }
      - name: service
        in: path
        required: true
        schema: { type: string }
      - name: op
        in: path
        required: true
        schema: { type: string, enum: [start, stop, restart, redeploy] }
    post:
      tags: [stacks]
      operationId: serviceOperation
      summary: Operate on one service of a stack
      description: |
        Requires `stacks:deploy`. Runs as a job (#29, ADR-0042) and leaves every other service
        alone, dependencies included.
        - `start`, `stop` and `restart` act on the service's containers. Starting a service
          without containers creates it with `compose up <service>`.
        - `redeploy` pulls the service's image and recreates its containers if the image
          changed, then runs `compose up <service>`.
        Errors:
        - 409 for a service without containers (except `start`) or while a job runs for the
          stack;
        - 503 in read-only mode.
      responses:
        "202":
          description: Job started
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/stacks/{name}/{op}:
    parameters:
      - $ref: "#/components/parameters/Env"
      - $ref: "#/components/parameters/Namespace"
      - name: name
        in: path
        required: true
        schema: { type: string }
      - name: op
        in: path
        required: true
        schema: { type: string, enum: [up, down, start, stop, restart, pull] }
    post:
      tags: [stacks]
      operationId: stackOperation
      summary: Run a stack operation as a job
      description: |
        Requires `stacks:deploy` (#28, #31, ADR-0026). Runs the host's `nerdctl compose <op>` in
        the stack directory; the output streams over `/jobs/{id}/stream`. One job per stack at a
        time (409). `volumes` (down only) deletes the project's volumes and requires `confirm`
        to equal the stack name. Unmanaged projects must be adopted first (404). `up` with
        `pull` pulls the images first and recreates the containers whose image changed
        (ADR-0042): `compose up` alone keeps a container whose tag now points to a new image.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                pull: { type: boolean, description: "up: pull images first (--pull=always)" }
                removeOrphans: { type: boolean, description: "up, down: remove containers of services no longer defined" }
                volumes: { type: boolean, description: "down: remove the project's volumes" }
                confirm: { type: string, description: The stack name, required with volumes }
      responses:
        "202":
          description: Job started
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/stacks/{name}/files/{file}:
    parameters:
      - $ref: "#/components/parameters/Env"
      - name: name
        in: path
        required: true
        schema: { type: string }
      - name: file
        in: path
        required: true
        schema: { type: string, enum: [compose, env] }
    get:
      tags: [stacks]
      operationId: getStackFile
      summary: Read the compose or .env file of a stack
      description: Requires `stacks:read` (#26). A missing .env is returned empty with `exists` false.
      responses:
        "200":
          description: File
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StackFile" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [stacks]
      operationId: putStackFile
      summary: Save the compose or .env file of a stack
      description: |
        Requires `stacks:write` (#26). The project must load with the new content (400). `version`
        is the version that was read (empty for a new .env); a different version on disk, or a
        running operation of the stack, is a conflict (409). The previous content is kept as
        `<file>.bak`; the write is atomic.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content, version]
              additionalProperties: false
              properties:
                content: { type: string }
                version: { type: string }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StackFile" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/stacks/{name}/tree:
    parameters:
      - $ref: "#/components/parameters/Env"
      - name: name
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [stacks]
      operationId: getStackTree
      summary: List the files of a stack's directory
      description: |
        Requires `stacks:read` (#27, ADR-0055). Directories first, then files, by name; `.git`,
        symbolic links and special files are left out, and the list stops at 2000 entries
        (`truncated`). The files of a Git stack are read-only.
      responses:
        "200":
          description: Tree
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StackTree" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/stacks/{name}/tree/file:
    parameters:
      - $ref: "#/components/parameters/Env"
      - name: name
        in: path
        required: true
        schema: { type: string }
      - name: path
        in: query
        required: true
        description: Path relative to the stack's directory, with slashes
        schema: { type: string }
    get:
      tags: [stacks]
      operationId: getStackPath
      summary: Read a file of a stack's directory
      description: |
        Requires `stacks:read` (#27). A missing file is returned with `exists` false; binary
        files and files over 1 MiB have no content. Paths cannot leave the directory.
      responses:
        "200":
          description: File
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StackPathFile" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [stacks]
      operationId: putStackPath
      summary: Create or replace a text file of a stack's directory
      description: |
        Requires `stacks:write` (#27). `version` is the version that was read, empty for a new
        file (409 if it exists, or if it changed on disk). Parent directories are created. The
        compose file and `.env` must keep the project loading (400) and keep a `.bak`; other
        files are saved, then the project is checked with them (`validation`). The files of a
        Git stack cannot be changed (409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content, version]
              additionalProperties: false
              properties:
                content: { type: string }
                version: { type: string }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                required: [file, validation]
                properties:
                  file: { $ref: "#/components/schemas/StackPathFile" }
                  validation: { $ref: "#/components/schemas/StackValidation" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
    delete:
      tags: [stacks]
      operationId: deleteStackPath
      summary: Delete a file or an empty directory of a stack's directory
      description: |
        Requires `stacks:write` (#27). `version` is the version of the file that was read (409
        if it changed). The compose file cannot be deleted, nor the files of a Git stack (409).
      parameters:
        - { name: version, in: query, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/stacks/{name}/variables:
    parameters:
      - $ref: "#/components/parameters/Env"
      - name: name
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [stacks]
      operationId: listStackVariables
      summary: Variables of a stack
      description: |
        Requires `stacks:read` (#35, ADR-0049). Passed to `nerdctl compose` as environment
        variables: compose files interpolate them as `${NAME}`, and they win over `.env` and
        global variables. Secret values are empty.
      responses:
        "200": { $ref: "#/components/responses/Variables" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/stacks/{name}/variables/{var}:
    parameters:
      - $ref: "#/components/parameters/Env"
      - name: name
        in: path
        required: true
        schema: { type: string }
      - $ref: "#/components/parameters/VariableName"
    put:
      tags: [stacks]
      operationId: putStackVariable
      summary: Create or change a variable of a stack
      description: Requires `stacks:write`. Takes effect on the next deploy.
      requestBody: { $ref: "#/components/requestBodies/VariableInput" }
      responses:
        "200": { $ref: "#/components/responses/Variable" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [stacks]
      operationId: deleteStackVariable
      summary: Delete a variable of a stack
      description: Requires `stacks:write`.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/stacks/{name}/validate:
    parameters:
      - $ref: "#/components/parameters/Env"
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [stacks]
      operationId: validateStack
      summary: Check compose and .env content without saving
      description: |
        Requires `stacks:write` (#26). Loads the project like `nerdctl compose` with the given
        content (left out: the file on disk), in the stack directory.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                compose: { type: string }
                env: { type: string }
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StackValidation" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/stacks/{name}/logs/stream:
    parameters:
      - $ref: "#/components/parameters/Env"
      - $ref: "#/components/parameters/Namespace"
      - name: name
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [stacks]
      operationId: streamStackLogs
      summary: Merged logs of a stack's containers (WebSocket)
      description: |
        Requires `stacks:read` (#30). The last `tail` lines of each container of the compose
        project (at most 5000, merged by time), then with `follow` the new lines of every
        container until all stop. Data messages are arrays of `StackLogLine`. Containers created
        later are not included; reconnect after a deploy.
      parameters:
        - name: tail
          in: query
          schema: { type: string, examples: ["200"] }
        - name: since
          in: query
          schema: { type: string }
        - name: follow
          in: query
          schema: { type: boolean }
      responses:
        "101": { description: Switching protocols }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/stacks/{name}/registration:
    parameters:
      - $ref: "#/components/parameters/Env"
      - name: name
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [stacks]
      operationId: forgetStack
      summary: Forget an adopted directory
      description: |
        Requires `stacks:write` (#25). Removes the registration of an external stack; its files
        and containers stay. Stacks in the stacks directory are refused (409).
      responses:
        "204": { description: Forgotten }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/stacks/{name}:
    parameters:
      - $ref: "#/components/parameters/Env"
      - $ref: "#/components/parameters/Namespace"
      - name: name
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [stacks]
      operationId: getStack
      summary: A stack with its services and containers
      description: Requires `stacks:read` (#24).
      responses:
        "200":
          description: Stack
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stack" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [stacks]
      operationId: deleteStack
      summary: Delete a stack created in nerdui, as a job
      description: |
        Requires `stacks:write` (#248, ADR-0052). Takes the stack down (`nerdctl compose down
        --remove-orphans`, with `-v` when `volumes` is set), then removes its files and
        variables: the directory of a stack in the stacks directory, or the clone and Git
        settings of a Git stack. Adopted stacks are forgotten instead (409).
      parameters:
        - { name: confirm, in: query, required: true, schema: { type: string }, description: The stack name }
        - { name: volumes, in: query, schema: { type: boolean }, description: Also remove the project's named volumes }
      responses:
        "202":
          description: Job started
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/host/metrics:
    parameters:
      - $ref: "#/components/parameters/Env"
    get:
      tags: [environments]
      operationId: getHostMetrics
      summary: CPU, memory, disk and network usage of the host
      description: |
        Requires `system:read` (#64, ADR-0054). nerdui samples the host it runs on every 15
        seconds and keeps one day in memory; history longer than 360 points is averaged.
        503 until the first sample.
      parameters:
        - name: range
          in: query
          schema: { type: string, enum: ["1h", "6h", "24h"], default: "1h" }
      responses:
        "200":
          description: Current values and history
          content:
            application/json:
              schema:
                type: object
                required: [current, points, range, intervalSeconds]
                properties:
                  current: { $ref: "#/components/schemas/HostSample" }
                  points: { type: array, items: { $ref: "#/components/schemas/HostPoint" } }
                  range: { type: string }
                  intervalSeconds: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/summary:
    parameters:
      - $ref: "#/components/parameters/Env"
    get:
      tags: [environments]
      operationId: getSummary
      summary: Resources and disk usage of a host
      description: |
        Requires `system:read` (#63). Across all namespaces: containers by state, images, volumes,
        networks, stacks; the size of the images (and of the volumes with `volumeSizes=true`,
        which walks every volume) and the filesystems of containerd's and nerdctl's data.
      parameters:
        - name: volumeSizes
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Summary" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/stats/stream:
    parameters:
      - $ref: "#/components/parameters/Env"
    get:
      tags: [containers]
      operationId: streamTopStats
      summary: Containers using most CPU and memory (WebSocket)
      description: |
        Requires `containers:read` (#63). Every 5 s while connected: the five running containers
        of all namespaces using most CPU and most memory (`TopStats` data messages). The first
        message comes after two samples.
      responses:
        "101": { description: Switching protocols }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/ports:
    parameters:
      - $ref: "#/components/parameters/Env"
    get:
      tags: [containers]
      operationId: listPorts
      summary: Published and exposed ports of all containers
      description: |
        Requires `containers:read` (#62). Across all namespaces: ports published on the host and
        ports only exposed by the image (EXPOSE). `conflicts` lists other containers using the
        same host port and protocol, and host sockets bound to it (read from /proc/net when
        nerdui runs on the host; `hostChecked` tells whether they were).
      responses:
        "200":
          description: Published ports first, by host port
          content:
            application/json:
              schema:
                type: object
                required: [ports, hostChecked]
                properties:
                  hostChecked: { type: boolean }
                  ports: { type: array, items: { $ref: "#/components/schemas/PortEntry" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/networks:
    parameters:
      - $ref: "#/components/parameters/Env"
      - $ref: "#/components/parameters/Namespace"
    get:
      tags: [networks]
      operationId: listNetworks
      summary: CNI networks of a namespace
      description: |
        Requires `networks:read` (#60, ADR-0024). With the containers attached to each network;
        addresses are reported for running containers.
      responses:
        "200":
          description: Networks sorted by name
          content:
            application/json:
              schema:
                type: object
                required: [namespace, networks]
                properties:
                  namespace: { type: string }
                  networks: { type: array, items: { $ref: "#/components/schemas/Network" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [networks]
      operationId: createNetwork
      summary: Create a bridge, macvlan or ipvlan network
      description: |
        Requires `networks:write`. Runs the host's `nerdctl network create` with validated
        arguments (ADR-0024); an existing name is 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NetworkSpec" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Network" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/networks/{name}:
    parameters:
      - $ref: "#/components/parameters/Env"
      - $ref: "#/components/parameters/Namespace"
      - name: name
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [networks]
      operationId: removeNetwork
      summary: Remove a network
      description: |
        Requires `networks:write`. Like `nerdctl network rm`: refused (409) while a running
        container uses it, and for default, pre-defined or externally managed networks.
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/volumes:
    parameters:
      - $ref: "#/components/parameters/Env"
      - $ref: "#/components/parameters/Namespace"
    get:
      tags: [volumes]
      operationId: listVolumes
      summary: Volumes of a namespace
      description: |
        Requires `volumes:read` (#57). nerdctl's named volumes with the containers (running or
        not) that mount them. `size=true` walks every volume on disk, like
        `nerdctl volume ls --size`.
      parameters:
        - name: size
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Volumes sorted by name
          content:
            application/json:
              schema:
                type: object
                required: [namespace, volumes]
                properties:
                  namespace: { type: string }
                  volumes: { type: array, items: { $ref: "#/components/schemas/Volume" } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [volumes]
      operationId: createVolume
      summary: Create a volume
      description: Requires `volumes:write`. Like `nerdctl volume create`; an existing name is 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { type: string }
                labels: { type: object, additionalProperties: { type: string } }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Volume" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/volumes/{name}:
    parameters:
      - $ref: "#/components/parameters/Env"
      - $ref: "#/components/parameters/Namespace"
      - name: name
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [volumes]
      operationId: removeVolume
      summary: Remove a volume and its data
      description: |
        Requires `volumes:write`. Refused (409) while any container, running or stopped, mounts
        the volume.
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/volumes/{name}/files:
    parameters:
      - $ref: "#/components/parameters/Env"
      - $ref: "#/components/parameters/Namespace"
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      tags: [volumes]
      operationId: listVolumeFiles
      summary: List a directory of a volume
      description: |
        Requires `volumes:write`: a volume's files may hold secrets (#58, ADR-0045). Read on the
        host, read-only; paths cannot leave the volume, also not through symlinks. Directories
        first, at most 5000 entries (`truncated`).
      parameters:
        - { name: path, in: query, schema: { type: string, default: / }, description: Directory in the volume }
      responses:
        "200":
          description: Directory entries
          content:
            application/json:
              schema:
                type: object
                required: [entries, truncated]
                properties:
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/VolumeEntry" }
                  truncated: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/volumes/{name}/files/preview:
    parameters:
      - $ref: "#/components/parameters/Env"
      - $ref: "#/components/parameters/Namespace"
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      tags: [volumes]
      operationId: previewVolumeFile
      summary: The beginning of a file in a volume
      description: Requires `volumes:write`. Up to 256 KiB of a regular file as text; binary files have no content.
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Preview
          content:
            application/json:
              schema:
                type: object
                required: [size, modTime, content, binary, truncated]
                properties:
                  size: { type: integer, format: int64 }
                  modTime: { type: string, format: date-time }
                  content: { type: string }
                  binary: { type: boolean }
                  truncated: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/volumes/{name}/backups:
    parameters:
      - $ref: "#/components/parameters/Env"
      - { name: name, in: path, required: true, schema: { type: string } }
      - $ref: "#/components/parameters/Namespace"
    get:
      tags: [volumes]
      operationId: listVolumeBackups
      summary: Archives of a volume in a backup target, newest first
      description: Requires `volumes:write` (#59, ADR-0050).
      parameters:
        - { name: target, in: query, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: Archives
          content:
            application/json:
              schema:
                type: object
                required: [backups]
                properties:
                  backups: { type: array, items: { $ref: "#/components/schemas/VolumeBackup" } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [volumes]
      operationId: backUpVolume
      summary: Back up a volume now
      description: |
        Requires `volumes:write`. Writes a tar.gz of the volume to the target and keeps the
        newest `keep` archives of the volume there.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VolumeBackupRequest" }
      responses:
        "202":
          description: Started
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/volumes/{name}/restore:
    parameters:
      - $ref: "#/components/parameters/Env"
      - { name: name, in: path, required: true, schema: { type: string } }
      - $ref: "#/components/parameters/Namespace"
    post:
      tags: [volumes]
      operationId: restoreVolume
      summary: Replace a volume's contents with an archive
      description: |
        Requires `volumes:write`. The volume is created when missing. Running containers using
        it are refused (the job fails) unless `stopContainers` is set.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VolumeBackupRequest" }
      responses:
        "202":
          description: Started
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/volumes/{name}/files/download:
    parameters:
      - $ref: "#/components/parameters/Env"
      - $ref: "#/components/parameters/Namespace"
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      tags: [volumes]
      operationId: downloadVolumeFile
      summary: Download a file, a directory or the whole volume
      description: |
        Requires `volumes:write`. A regular file as is; a directory (`path=/` for the volume) as
        a gzip-compressed tar archive with symlinks kept as links. An error after the download
        started aborts the connection.
      parameters:
        - { name: path, in: query, schema: { type: string, default: / } }
      responses:
        "200":
          description: File or archive
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
            application/gzip:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/registries:
    parameters:
      - $ref: "#/components/parameters/Env"
    get:
      tags: [registries]
      operationId: listRegistries
      summary: Registries the host is logged in to
      description: |
        Requires `registries:read`. Read from the docker config of the user running nerdui (the
        same file `nerdctl login` writes); passwords are never returned.
      responses:
        "200":
          description: Registries sorted by server
          content:
            application/json:
              schema:
                type: object
                required: [registries]
                properties:
                  registries: { type: array, items: { $ref: "#/components/schemas/Registry" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [registries]
      operationId: loginRegistry
      summary: Log in to a registry
      description: |
        Requires `registries:write`. Like `nerdctl login`: the credentials are verified with the
        registry (400 when rejected, 503 when unreachable) and stored in the docker config, where
        pull, push and compose use them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [server, username, password]
              additionalProperties: false
              properties:
                server: { type: string, examples: ["registry.local:5000", "ghcr.io"] }
                username: { type: string }
                password: { type: string, description: Password or access token }
      responses:
        "201":
          description: Logged in
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Registry"
                  - type: object
                    properties:
                      warning: { type: string, description: Set when the password is stored unencrypted }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    delete:
      tags: [registries]
      operationId: logoutRegistry
      summary: Log out of a registry
      description: Requires `registries:write`. Like `nerdctl logout`.
      parameters:
        - name: server
          in: query
          required: true
          schema: { type: string }
      responses:
        "204": { description: Logged out }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/containers/{id}/{action}:
    parameters:
      - $ref: "#/components/parameters/Env"
      - $ref: "#/components/parameters/ContainerID"
      - name: action
        in: path
        required: true
        schema: { type: string, enum: [start, stop, restart, kill, pause, unpause] }
      - $ref: "#/components/parameters/Namespace"
    post:
      tags: [containers]
      operationId: containerAction
      summary: Start, stop, restart, kill, pause or unpause a container
      description: |
        Requires `containers:operate`. Synchronous: stop and restart wait for the container to
        exit (its stop timeout, 10 s by default, then SIGKILL). Kill sends SIGKILL.
        Unsafe request — send the CSRF token. Answers 409 when the action does not apply to
        the current state (e.g. pause on a stopped container) and 503 `nerdctl_incompatible`
        in read-only mode. Other failures carry nerdctl's error message.
      responses:
        "204": { description: Done }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/containers/{id}:
    parameters:
      - $ref: "#/components/parameters/Env"
      - $ref: "#/components/parameters/ContainerID"
      - $ref: "#/components/parameters/Namespace"
    delete:
      tags: [containers]
      operationId: removeContainer
      summary: Remove a container
      description: |
        Requires `containers:write`. Like `nerdctl rm`: releases the name and published ports.
        A running or paused container is only removed with `force=true` (killed first);
        otherwise 409. Unsafe request — send the CSRF token.
      parameters:
        - name: force
          in: query
          schema: { type: boolean, default: false }
          description: Kill a running or paused container before removing it
        - name: volumes
          in: query
          schema: { type: boolean, default: false }
          description: Also remove the container's anonymous volumes
      responses:
        "204": { description: Removed }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/containers/{id}/spec:
    parameters:
      - $ref: "#/components/parameters/Env"
      - $ref: "#/components/parameters/Namespace"
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [containers]
      operationId: getContainerSpec
      summary: Settings to edit and recreate a container
      description: |
        Requires `containers:read` (#18, ADR-0031). Reconstructed from `nerdctl inspect`: values
        equal to the image's defaults are left out. `unsupported` lists settings the create form
        cannot express; while it is not empty, recreating is refused.
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContainerSpec" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/containers/{id}/recreate:
    parameters:
      - $ref: "#/components/parameters/Env"
      - $ref: "#/components/parameters/Namespace"
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [containers]
      operationId: recreateContainer
      summary: Recreate a container with edited settings (background job)
      description: |
        Requires `containers:write` and a compatible host nerdctl (#18, ADR-0031). With `pull`,
        the image is pulled first (an update). The old container is stopped and renamed, the
        new one created under the same name and started when the old one ran, then the old one
        is removed; if creating or starting fails, the old container is restored. Refused (409)
        for stack containers and containers with unsupported settings. The job's `result` has
        `containerId`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecreateContainerRequest" }
      responses:
        "202":
          description: Job started
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/containers/{id}/inspect:
    parameters:
      - $ref: "#/components/parameters/Env"
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$", maxLength: 76 }
        description: Full or short container ID, or name (resolved like `nerdctl inspect`)
      - $ref: "#/components/parameters/Namespace"
    get:
      tags: [containers]
      operationId: inspectContainer
      summary: Full container configuration
      description: |
        Requires `containers:read`. Same JSON as `nerdctl inspect` (dockercompat mode,
        ADR-0013); only the fields used by the UI are described here. A reference that
        matches several containers → 400.
      parameters:
        - name: size
          in: query
          schema: { type: boolean, default: false }
          description: Also compute SizeRw and SizeRootFs (slow for large containers)
      responses:
        "200":
          description: Container
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContainerInspect" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/containers/{id}/logs:
    parameters:
      - $ref: "#/components/parameters/Env"
      - $ref: "#/components/parameters/ContainerID"
      - $ref: "#/components/parameters/Namespace"
    get:
      tags: [containers]
      operationId: downloadContainerLogs
      summary: Container logs as plain text (download)
      description: |
        Requires `containers:read`. Like `nerdctl logs` without `--follow`: stdout and stderr
        interleaved, ANSI sequences preserved. Sent as an attachment `<id12>-logs.txt`.
      parameters:
        - name: tail
          in: query
          schema: { type: string, examples: ["500", "all"] }
          description: Only the last N lines; empty or `all` = all lines
        - name: since
          in: query
          schema: { type: string, examples: ["2027-03-01T10:00:00Z", "10m"] }
          description: Lines at or after this time (RFC 3339 or relative), second precision
        - name: until
          in: query
          schema: { type: string }
          description: Lines at or before this time (RFC 3339 or relative)
        - name: timestamps
          in: query
          schema: { type: boolean, default: false }
          description: Prefix lines with their RFC 3339 time
      responses:
        "200":
          description: Log text
          content:
            text/plain:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/containers/{id}/top:
    parameters:
      - $ref: "#/components/parameters/Env"
      - $ref: "#/components/parameters/Namespace"
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [containers]
      operationId: containerTop
      summary: Processes of a container
      description: |
        Requires `containers:read`. Lists the processes of a running container, read from the
        host's /proc (#20): PIDs and users as the host sees them, CPU as a share of one CPU since
        the process started (like `ps`), resident memory. 409 when the container is not running.
      responses:
        "200":
          description: Processes, ordered by PID
          content:
            application/json:
              schema:
                type: object
                required: [processes]
                properties:
                  processes:
                    type: array
                    items: { $ref: "#/components/schemas/Process" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/containers/{id}/stats/stream:
    parameters:
      - $ref: "#/components/parameters/Env"
      - $ref: "#/components/parameters/Namespace"
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: Full container ID
    get:
      tags: [containers]
      operationId: streamContainerStats
      summary: Live resource usage of a running container (WebSocket)
      description: |
        Requires `containers:read` (#16). Samples like `nerdctl stats` every `interval` (1s to
        10s, default 2s) while the client is connected; data messages are `StatsSample`s. The
        stream ends with `end` when the container stops; a container that is not running gets
        an error (`conflict`) and `end`.
      parameters:
        - name: interval
          in: query
          schema: { type: string, examples: ["2s"] }
      responses:
        "101": { description: Switching protocols }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/containers/{id}/stats/history:
    parameters:
      - $ref: "#/components/parameters/Env"
      - $ref: "#/components/parameters/Namespace"
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: Full container ID (the container may be stopped or removed)
    get:
      tags: [containers]
      operationId: getContainerStatsHistory
      summary: Resource usage history of a container from Prometheus
      description: |
        Requires `containers:read` (#176, ADR-0023). Reads containerd's built-in metrics from the
        environment's Prometheus server with fixed queries. 409 when no Prometheus is
        configured, 503 when it is unreachable or rejects the query.
      parameters:
        - name: range
          in: query
          required: true
          schema: { type: string, enum: ["1h", "6h", "24h", "7d"] }
      responses:
        "200":
          description: History on a common time axis
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatsHistory" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/image-updates:
    parameters:
      - $ref: "#/components/parameters/Env"
      - $ref: "#/components/parameters/Namespace"
    get:
      tags: [images]
      operationId: listImageUpdates
      summary: Image update checks of a namespace
      description: |
        Requires `images:read` (#53, ADR-0030). The stored registry digest of each checked
        reference present in the namespace, compared with the local image now: a pull clears
        `updateAvailable` at once. Also reports the schedule.
      responses:
        "200":
          description: Checks and schedule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageUpdateOverview" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/auto-updates:
    parameters:
      - $ref: "#/components/parameters/Env"
      - $ref: "#/components/parameters/Namespace"
    get:
      tags: [containers]
      operationId: listAutoUpdates
      summary: Log of automatic updates of a namespace
      description: |
        Requires `containers:read` (#54, ADR-0032). Containers and compose services labeled
        `nerdui.auto-update=true` are pulled and recreated after each scheduled image update check
        that finds a newer image. Newest first, at most 100 entries; kept for 90 days.
      responses:
        "200":
          description: Log entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutoUpdatesLog" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/auto-updates/approve:
    parameters:
      - $ref: "#/components/parameters/Env"
    post:
      tags: [containers]
      operationId: approveAutoUpdates
      summary: Apply automatic updates waiting for approval
      description: |
        Requires `settings:write` (#56, ADR-0033). When a scheduled check finds more due updates
        than `maxBatch`, none is applied until approved. They are planned again and started in the
        background; each runs as a job and is logged.
      responses:
        "202":
          description: Started
          content:
            application/json:
              schema:
                type: object
                required: [updates]
                properties:
                  updates: { type: integer }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/image-updates/check:
    parameters:
      - $ref: "#/components/parameters/Env"
    post:
      tags: [images]
      operationId: checkImageUpdates
      summary: Check images for updates now
      description: |
        Requires `images:read`. Without `ref`, resolves every tag used by containers of any
        namespace (digest-pinned references are skipped); with `ref`, that tag only. One HEAD
        request per tag, with nerdctl's registry configuration and credentials. 409 while a
        check runs.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckImageUpdatesRequest" }
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageUpdateReport" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/settings/auto-updates:
    parameters:
      - $ref: "#/components/parameters/Env"
    get:
      tags: [settings]
      operationId: getAutoUpdateSettings
      summary: Guards of automatic updates
      description: "Requires `settings:read` (#56). Default: no delay, approval above 5 updates."
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutoUpdateSettings" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
    put:
      tags: [settings]
      operationId: putAutoUpdateSettings
      summary: Set the guards of automatic updates
      description: "Requires `settings:write`."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutoUpdateSettings" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutoUpdateSettings" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/settings/prometheus:
    parameters:
      - $ref: "#/components/parameters/Env"
    get:
      tags: [settings]
      operationId: getPrometheusSettings
      summary: Prometheus connection of the environment
      description: Requires `settings:read` (#176). The password or token is never returned.
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrometheusSettings" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [settings]
      operationId: putPrometheusSettings
      summary: Set the Prometheus connection
      description: |
        Requires `settings:write`. An empty secret keeps the stored one when the authentication
        mode is unchanged. Stored in nerdui's database.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrometheusSettingsInput" }
      responses:
        "200":
          description: Saved settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrometheusSettings" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
    delete:
      tags: [settings]
      operationId: deletePrometheusSettings
      summary: Remove the Prometheus connection
      description: Requires `settings:write`.
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/settings/prometheus/test:
    parameters:
      - $ref: "#/components/parameters/Env"
    post:
      tags: [settings]
      operationId: testPrometheusSettings
      summary: Test a Prometheus connection without saving it
      description: |
        Requires `settings:write`. Runs an instant query and reports how many containers have
        containerd metrics in Prometheus (0 means containerd is not scraped yet).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrometheusSettingsInput" }
      responses:
        "200":
          description: The server answered
          content:
            application/json:
              schema:
                type: object
                required: [containers]
                properties:
                  version: { type: string }
                  containers: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/containers/{id}/exec:
    parameters:
      - $ref: "#/components/parameters/Env"
      - $ref: "#/components/parameters/Namespace"
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: Full container ID
    get:
      tags: [containers]
      operationId: execContainer
      summary: Terminal in a running container (WebSocket)
      description: |
        Requires `containers:exec` (#15, ADR-0022); 403 when the server runs with
        `--disable-exec`. Like `nerdctl exec -it`. Binary frames carry input (client) and
        terminal output (server); the client sends `{"type":"resize","cols":n,"rows":n}` as
        text. The session ends with a data message `{"exitCode": n}` and `end`; closing the
        WebSocket kills the process. A container that is not running gets an error
        (`conflict`).
      parameters:
        - name: cmd
          in: query
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
          description: argv, repeated; default bash if present, else sh
        - name: user
          in: query
          schema: { type: string }
          description: Name or UID[:GID], resolved in the container
        - name: workdir
          in: query
          schema: { type: string }
        - name: cols
          in: query
          schema: { type: integer }
        - name: rows
          in: query
          schema: { type: integer }
      responses:
        "101": { description: Switching protocols }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/containers/{id}/logs/stream:
    parameters:
      - $ref: "#/components/parameters/Env"
      - $ref: "#/components/parameters/ContainerID"
      - $ref: "#/components/parameters/Namespace"
    get:
      tags: [containers]
      operationId: streamContainerLogs
      summary: Container logs (WebSocket)
      description: |
        WebSocket stream (ADR-0007, ADR-0014); requires `containers:read` and a same-origin
        upgrade. `StreamMessage.data` is an array of `LogLine`. The stream sends `end` when the
        logs are exhausted or, with `follow`, when the container stops. Errors (unknown
        container, log driver `none` → `conflict`) arrive as `error` followed by `end`.
        To resume after a disconnect, reconnect with `since` = last `ts` and skip lines up to it.
      parameters:
        - name: follow
          in: query
          schema: { type: boolean, default: false }
          description: Keep streaming new lines while the container runs
        - name: tail
          in: query
          schema: { type: string, examples: ["500", "all"] }
          description: Only the last N lines; empty or `all` = all lines
        - name: since
          in: query
          schema: { type: string, examples: ["2027-03-01T10:00:00Z", "10m"] }
          description: Lines at or after this time (RFC 3339 or relative), second precision
      responses:
        "101": { description: Switching protocols (WebSocket) }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/environments/{env}/containers/actions:
    parameters:
      - $ref: "#/components/parameters/Env"
      - $ref: "#/components/parameters/Namespace"
    post:
      tags: [containers]
      operationId: bulkContainerAction
      summary: Apply one action to several containers
      description: |
        Requires `containers:operate`, and `containers:write` for `remove`. Up to 200 IDs; runs
        a few at a time and answers 200 with one result per ID in request order, so partial
        failures are reported per container. Unsafe request — send the CSRF token.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkActionRequest" }
      responses:
        "200":
          description: Per-container results
          content:
            application/json:
              schema:
                type: object
                required: [action, results]
                properties:
                  action: { $ref: "#/components/schemas/ContainerActionName" }
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/BulkActionResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
components:
  requestBodies:
    PasswordConfirm:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [password]
            properties:
              password: { type: string, description: The current password, to confirm }
    VariableInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              value:
                type: string
                maxLength: 65536
                description: Left out, the stored value is kept (required for a new variable and to make a secret visible)
              secret: { type: boolean, description: Never return the value }
    TemplateInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, compose]
            additionalProperties: false
            properties:
              name: { type: string, maxLength: 100 }
              description: { type: string, maxLength: 1000 }
              compose: { type: string }
              env: { type: string, description: ".env.example: KEY=default lines described by the comments above them" }
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: |
        API key (#87, ADR-0028): `Authorization: Bearer nerdui_…`. Acts as its user; a read-only
        key may only read. No CSRF token is needed. Keys cannot log out, change the password or
        manage keys.
    session:
      type: apiKey
      in: cookie
      name: nerdui_session
      description: |
        Server-side session (ADR-0005). Unsafe requests (POST, PUT, PATCH, DELETE) must also
        send the session's CSRF token in the X-CSRF-Token header.
  parameters:
    VariableName:
      name: var
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z_][A-Za-z0-9_]*$", maxLength: 128 }
      description: Variable name
    JobId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Job ID
    UserId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
      description: User ID
    Env:
      name: env
      in: path
      required: true
      schema: { type: string, examples: ["local"] }
      description: Environment ID
    Namespace:
      name: namespace
      in: query
      required: false
      schema: { type: string, examples: ["default", "k8s.io"] }
      description: containerd namespace; defaults to the environment's default namespace
    ContainerID:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$", maxLength: 76 }
      description: Full container ID (prefixes and names are not resolved)
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
      description: CSRF token from SessionResponse.csrfToken
  responses:
    BackupCodes:
      description: |
        Ten one-time backup codes, shown only now; each signs in once instead of an authenticator
        code. Earlier codes stop working.
      content:
        application/json:
          schema:
            type: object
            required: [backupCodes]
            properties:
              backupCodes: { type: array, items: { type: string } }
    Template:
      description: The template
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Template" }
    TemplateRegistries:
      description: Registry URLs
      content:
        application/json:
          schema:
            type: object
            required: [urls]
            properties:
              urls: { type: array, items: { type: string } }
    Variable:
      description: The variable
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Variable" }
    Variables:
      description: Variables by name
      content:
        application/json:
          schema:
            type: object
            required: [variables]
            properties:
              variables: { type: array, items: { $ref: "#/components/schemas/Variable" } }
    Error:
      description: Error (ADR-0006)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many attempts
      headers:
        Retry-After: { schema: { type: integer }, description: Seconds to wait }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    ContainerSpec:
      type: object
      required: [id, spec, unsupported, running]
      properties:
        id: { type: string }
        spec:
          allOf: [{ $ref: "#/components/schemas/CreateContainerRequest" }]
        unsupported: { type: array, items: { type: string } }
        running: { type: boolean }
        stack: { type: string, description: Compose project managing the container }
        imageChanged:
          type: boolean
          description: The tag points to another image than when the container was created
    RecreateContainerRequest:
      allOf:
        - $ref: "#/components/schemas/CreateContainerRequest"
        - type: object
          properties:
            pull: { type: boolean, description: Pull the image first (update) }
    TemplateSummary:
      type: object
      required: [source, id, name]
      properties:
        source: { type: string, description: "builtin, custom or the URL of a registry" }
        id: { type: string }
        name: { type: string }
        description: { type: string }
        categories: { type: array, items: { type: string } }
        logo: { type: string }
        documentation: { type: string }
        updatedAt: { type: string, format: date-time }
    Template:
      allOf:
        - $ref: "#/components/schemas/TemplateSummary"
        - type: object
          required: [compose, env, variables]
          properties:
            compose: { type: string }
            env: { type: string }
            variables:
              type: array
              items:
                type: object
                required: [name, default, secret]
                properties:
                  name: { type: string }
                  default: { type: string }
                  description: { type: string }
                  secret: { type: boolean, description: Guessed from the name }
    S3Options:
      type: object
      required: [endpoint, bucket, accessKey]
      additionalProperties: false
      properties:
        endpoint: { type: string, description: "host[:port] (HTTPS) or an http(s):// URL" }
        region: { type: string }
        bucket: { type: string }
        prefix: { type: string }
        accessKey: { type: string }
        pathStyle: { type: boolean, description: "Address the bucket as endpoint/bucket (MinIO)" }
    BackupTarget:
      type: object
      required: [id, name, kind, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        kind: { type: string, enum: [local, s3] }
        directory: { type: string }
        s3: { $ref: "#/components/schemas/S3Options" }
        hasSecret: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BackupTargetInput:
      type: object
      required: [name, kind]
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 100 }
        kind: { type: string, enum: [local, s3] }
        directory: { type: string, description: "local: an absolute directory on the host" }
        s3: { $ref: "#/components/schemas/S3Options" }
        secretKey: { type: string, description: "S3 secret key; empty keeps the stored one" }
    VolumeBackup:
      type: object
      required: [key, size, time]
      properties:
        key: { type: string, description: "<namespace>/<volume>/<volume>-<time>.tar.gz" }
        size: { type: integer, format: int64 }
        time: { type: string, format: date-time }
    VolumeBackupRequest:
      type: object
      required: [targetId]
      additionalProperties: false
      properties:
        targetId: { type: integer, format: int64 }
        key: { type: string, description: "restore: the archive" }
        keep: { type: integer, minimum: 0, maximum: 1000, description: "backup: archives of the volume to keep (0: 7)" }
        stopContainers: { type: boolean, description: "Stop running containers using the volume meanwhile and start them again" }
    ScheduleKind:
      type: string
      enum: [prune, backup, stack.redeploy, stack.restart, container.redeploy, container.restart, image-updates.check, volume.backup]
    ScheduleOptions:
      type: object
      additionalProperties: false
      description: "prune: what to remove; backup: directory on the host (default <data-dir>/backups) and how many archives to keep (default 7); volume.backup: the backup target, how many archives to keep (default 7) and whether containers using the volume are stopped meanwhile"
      properties:
        containers: { type: boolean }
        images: { type: boolean }
        allImages: { type: boolean }
        networks: { type: boolean }
        buildCache: { type: boolean }
        directory: { type: string }
        keep: { type: integer, minimum: 0, maximum: 1000 }
        targetId: { type: integer, format: int64 }
        stopContainers: { type: boolean }
    ScheduleInput:
      type: object
      required: [name, kind, cron, enabled]
      additionalProperties: false
      properties:
        name: { type: string }
        kind: { $ref: "#/components/schemas/ScheduleKind" }
        environment: { type: string, description: All kinds but backup }
        namespace: { type: string, description: Prune, stacks and containers }
        target: { type: string, description: Stack or container name }
        options: { $ref: "#/components/schemas/ScheduleOptions" }
        password: { type: string, writeOnly: true, description: "Backups: at least 12 characters; empty keeps the stored one" }
        cron: { type: string, examples: ["0 3 * * *", "@daily"] }
        enabled: { type: boolean }
    Schedule:
      type: object
      required: [id, name, kind, options, cron, enabled, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        kind: { $ref: "#/components/schemas/ScheduleKind" }
        environment: { type: string }
        namespace: { type: string }
        target: { type: string }
        options: { $ref: "#/components/schemas/ScheduleOptions" }
        hasPassword: { type: boolean }
        cron: { type: string }
        enabled: { type: boolean }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        nextRunAt: { type: string, format: date-time }
        lastRunAt: { type: string, format: date-time }
        lastStatus: { type: string, enum: ["", running, succeeded, failed, skipped] }
        lastMessage: { type: string }
    Variable:
      type: object
      required: [name, value, secret, updatedAt]
      properties:
        name: { type: string }
        value: { type: string, description: Empty for secrets }
        secret: { type: boolean }
        updatedBy: { type: string }
        updatedAt: { type: string, format: date-time }
    ScheduleRun:
      type: object
      required: [id, trigger, startedAt, status]
      properties:
        id: { type: integer, format: int64 }
        trigger: { type: string, enum: [schedule, manual] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        status: { type: string, enum: [running, succeeded, failed, skipped] }
        message: { type: string }
        jobId: { type: string }
    CheckImageUpdatesRequest:
      type: object
      additionalProperties: false
      properties:
        ref: { type: string, description: "One reference; empty checks all used ones", examples: ["docker.io/library/nginx:1.27"] }
    ImageUpdateReport:
      type: object
      required: [checked, updates, failed]
      properties:
        checked: { type: integer }
        updates: { type: integer }
        failed: { type: integer }
    ImageUpdateStatus:
      type: object
      required: [ref, localDigest, checkedAt, updateAvailable, containers]
      properties:
        ref: { type: string }
        localDigest: { type: string }
        remoteDigest: { type: string }
        checkedAt: { type: string, format: date-time }
        error: { type: string, description: Why the registry could not be asked }
        updateAvailable: { type: boolean }
        containers: { type: integer, description: Containers of the namespace created from the reference }
    ImageUpdateOverview:
      type: object
      required: [running, images]
      properties:
        lastCheck: { type: string, format: date-time }
        nextCheck: { type: string, format: date-time, description: Next run of the image update schedule (#82) }
        running: { type: boolean }
        images:
          type: array
          items: { $ref: "#/components/schemas/ImageUpdateStatus" }
    AutoUpdateEntry:
      type: object
      required: [id, namespace, kind, name, refs, status, startedAt, finishedAt]
      properties:
        id: { type: integer, format: int64 }
        namespace: { type: string }
        kind: { type: string, enum: [container, stack] }
        name: { type: string, description: Container name or stack name }
        refs: { type: array, items: { type: string }, description: Image references updated }
        status: { type: string, enum: [updated, failed, skipped] }
        message: { type: string, description: Why the update failed or was skipped }
        jobId: { type: string, description: The job that ran the update (kept for an hour) }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
    AutoUpdatesLog:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/AutoUpdateEntry" }
        pending: { $ref: "#/components/schemas/AutoUpdatePending" }
    AutoUpdatePending:
      type: object
      description: Updates of the environment (all namespaces) waiting for approval
      required: [since, targets]
      properties:
        since: { type: string, format: date-time }
        targets:
          type: array
          items:
            type: object
            required: [kind, namespace, name, refs]
            properties:
              kind: { type: string, enum: [container, stack] }
              namespace: { type: string }
              name: { type: string }
              services: { type: array, items: { type: string } }
              refs: { type: array, items: { type: string } }
    AutoUpdateSettings:
      type: object
      required: [delaySeconds, maxBatch]
      additionalProperties: false
      properties:
        delaySeconds:
          type: integer
          format: int64
          enum: [0, 3600, 21600, 86400, 259200, 604800]
          description: How long a new image must have been seen in the registry before it is applied
        maxBatch:
          type: integer
          enum: [0, 1, 3, 5, 10, 20]
          description: More due updates than this wait for approval; 0 never asks
    AuditEntry:
      type: object
      required: [id, at, action, result]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        user: { type: string }
        apiKey: { type: boolean, description: The request used an API key }
        apiKeyName: { type: string, description: "Name and prefix of the API key: \"<name> (<prefix>…)\"" }
        action: { type: string, description: "Permission used, e.g. containers:write, or auth:login / auth:setup" }
        method: { type: string }
        path: { type: string, description: "Route pattern, e.g. /api/v1/environments/{env}/containers/{id}/recreate" }
        environment: { type: string }
        namespace: { type: string }
        object: { type: string, description: Route parameters other than the environment, joined with / }
        status: { type: integer, description: HTTP status }
        result: { type: string, enum: [ok, failed, denied, accepted] }
        message: { type: string }
        jobId: { type: string }
        clientIp: { type: string }
        userAgent: { type: string }
    HostDisk:
      type: object
      required: [path, paths, total, used]
      properties:
        path: { type: string }
        paths: { type: array, items: { type: string }, description: Watched directories on this filesystem }
        total: { type: integer, format: int64 }
        used: { type: integer, format: int64 }
    HostSample:
      type: object
      required: [time, cpu, cpus, load1, memoryUsed, memoryTotal, swapUsed, swapTotal, netRx, netTx, disks]
      properties:
        time: { type: string, format: date-time }
        cpu: { type: number, description: Busy percent of all CPUs }
        cpus: { type: integer }
        load1: { type: number }
        memoryUsed: { type: integer, format: int64, description: Memory not available to new programs }
        memoryTotal: { type: integer, format: int64 }
        swapUsed: { type: integer, format: int64 }
        swapTotal: { type: integer, format: int64 }
        netRx: { type: number, description: Bytes per second received by physical interfaces }
        netTx: { type: number }
        disks: { type: array, items: { $ref: "#/components/schemas/HostDisk" } }
    HostPoint:
      type: object
      required: [t, cpu, memory, netRx, netTx, disks]
      properties:
        t: { type: integer, format: int64, description: Unix seconds }
        cpu: { type: number }
        memory: { type: number, description: Used percent }
        netRx: { type: number }
        netTx: { type: number }
        disks: { type: object, additionalProperties: { type: number }, description: Used percent by filesystem path }
    HostThreshold:
      type: object
      required: [enabled, percent, minutes]
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        percent: { type: number, minimum: 1, maximum: 100 }
        minutes: { type: integer, minimum: 0, maximum: 1440, description: How long the usage must stay above; 0 alerts at once }
    HostAlerts:
      type: object
      required: [cpu, memory, disk]
      additionalProperties: false
      properties:
        cpu: { $ref: "#/components/schemas/HostThreshold" }
        memory: { $ref: "#/components/schemas/HostThreshold" }
        disk: { $ref: "#/components/schemas/HostThreshold", description: Applies to each watched filesystem }
    NotificationKind:
      type: string
      enum: [image.update, autoupdate.updated, autoupdate.failed, autoupdate.pending, container.died, container.oom, container.unhealthy, container.autoheal, job.failed, git.update, host.alert]
    NotificationConfig:
      type: object
      description: |
        Settings of a channel; which fields apply depends on the type. `secret`, `token`,
        `password` and, for Slack and Discord, `url` are write-only.
      additionalProperties: false
      properties:
        url: { type: string }
        secret: { type: string, description: HMAC-SHA256 key of the webhook's X-Nerdui-Signature }
        token: { type: string }
        chatId: { type: string }
        host: { type: string }
        port: { type: integer }
        tls: { type: string, enum: [starttls, tls, none] }
        username: { type: string }
        password: { type: string }
        from: { type: string }
        to: { type: string, description: Comma-separated addresses }
    NotificationChannelInput:
      type: object
      required: [name, type, config, events, enabled]
      properties:
        name: { type: string, maxLength: 100 }
        type: { type: string, enum: [webhook, slack, discord, telegram, ntfy, gotify, email] }
        config: { $ref: "#/components/schemas/NotificationConfig" }
        events:
          type: array
          items: { $ref: "#/components/schemas/NotificationKind" }
        enabled: { type: boolean }
    NotificationChannel:
      type: object
      required: [id, name, type, config, secrets, events, enabled]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        type: { type: string, enum: [webhook, slack, discord, telegram, ntfy, gotify, email] }
        config: { $ref: "#/components/schemas/NotificationConfig" }
        secrets: { type: array, items: { type: string }, description: Write-only fields that are set }
        events:
          type: array
          items: { $ref: "#/components/schemas/NotificationKind" }
        enabled: { type: boolean }
        lastSentAt: { type: string, format: date-time }
        lastError: { type: string, description: Error of the newest delivery, empty when it succeeded }
    NamespaceSpec:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, example: lab }
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    BuildInfo:
      type: object
      required: [version, commit, date, goVersion, platform, source, license]
      properties:
        source:
          type: string
          format: uri
          description: Source code of the running build (AGPL-3.0 section 13).
          examples: ["https://github.com/pessom/nerdui"]
        license:
          type: string
          description: SPDX license identifier.
          examples: ["AGPL-3.0-only"]
        version: { type: string, examples: ["v0.1.0"] }
        commit: { type: string }
        date: { type: string }
        goVersion: { type: string, examples: ["go1.27.4"] }
        platform: { type: string, examples: ["linux/amd64"] }
    RuntimeVersions:
      type: object
      required: [containerd, containerdRevision, containerdSupported, supportedContainerd, nerdctlLibrary, nerdctl]
      properties:
        containerd: { type: string, examples: ["v2.4.2"] }
        containerdRevision: { type: string }
        containerdSupported:
          type: boolean
          description: False for containerd versions outside the supported set (ADR-0012); nerdui still works.
        supportedContainerd:
          type: array
          items: { type: string }
          description: containerd minors supported by this build; depends on its nerdctl version (ADR-0017)
          examples: [["2.3", "2.4"]]
        nerdctlLibrary: { type: string, examples: ["v2.4.2"] }
        nerdctl: { $ref: "#/components/schemas/NerdctlStatus" }
    NerdctlStatus:
      type: object
      description: |
        Host nerdctl compatibility (ADR-0011). When neither `compatible` nor `checkSkipped` is
        true, the environment is read-only: mutating requests fail with 503 `nerdctl_incompatible`.
      required: [path, required, compatible]
      properties:
        path: { type: string, examples: ["nerdctl"] }
        version: { type: string, examples: ["2.4.2"] }
        required: { type: string, description: Required major.minor, examples: ["2.4"] }
        compatible: { type: boolean }
        checkSkipped: { type: boolean }
        error: { type: string }
    VersionResponse:
      type: object
      required: [nerdui]
      properties:
        nerdui:
          $ref: "#/components/schemas/BuildInfo"
        runtime:
          $ref: "#/components/schemas/RuntimeVersions"
        error:
          type: string
        acme: { $ref: "#/components/schemas/ACMEStatus" }
    ACMEStatus:
      type: object
      description: ACME certificates (#113); shown to callers with `system:read` when configured.
      required: [domains, ready]
      properties:
        domains: { type: array, items: { type: string } }
        ready: { type: boolean, description: A certificate was obtained and is served }
        notAfter: { type: string, format: date-time }
        error: { type: string, description: Newest failure while no certificate is ready; the self-signed one is served }
        errorAt: { type: string, format: date-time }
    Environment:
      type: object
      required: [id, name, kind, defaultNamespace]
      properties:
        id: { type: string, examples: ["local"] }
        name: { type: string }
        kind: { type: string, enum: [local] }
        defaultNamespace: { type: string }
    EnvironmentStatus:
      allOf:
        - $ref: "#/components/schemas/Environment"
        - type: object
          required: [status, features]
          properties:
            status: { type: string, enum: [connected, unavailable] }
            error: { type: string }
            runtime: { $ref: "#/components/schemas/RuntimeVersions" }
            features:
              type: object
              required: [exec, metricsHistory]
              properties:
                exec: { type: boolean, description: "False when the web terminal is disabled (--disable-exec)" }
                metricsHistory: { type: boolean, description: "True when a Prometheus connection is configured (#176)" }
    Container:
      type: object
      required: [id, name, namespace, image, command, state, createdAt, ports, labels]
      properties:
        id: { type: string, description: Full container ID (64 hex characters) }
        name: { type: string, description: nerdctl name (may be empty for non-nerdctl containers) }
        namespace: { type: string }
        image: { type: string }
        command: { type: string }
        state: { type: string, enum: [created, running, paused, restarting, exited, unknown] }
        health: { type: string, enum: [healthy, unhealthy, starting] }
        exitCode: { type: integer }
        exitedAt: { type: string, format: date-time }
        startedAt:
          type: string
          format: date-time
          description: Start time of the container's main process (running/paused containers)
        createdAt: { type: string, format: date-time }
        ports:
          type: array
          items: { $ref: "#/components/schemas/Port" }
        compose: { $ref: "#/components/schemas/ComposeRef" }
        platform: { type: string }
        runtime: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }
    Port:
      type: object
      required: [hostPort, containerPort, protocol]
      properties:
        hostIp: { type: string }
        hostPort: { type: integer }
        containerPort: { type: integer }
        protocol: { type: string, enum: [tcp, udp, sctp] }
    ComposeRef:
      type: object
      required: [project]
      properties:
        project: { type: string }
        service: { type: string }
    Event:
      type: object
      required: [ts, topic, kind, action]
      properties:
        ts: { type: string, format: date-time }
        namespace: { type: string }
        topic: { type: string, examples: ["/containers/create", "/tasks/exit", "/nerdui/connected"] }
        kind: { type: string, examples: ["container", "task", "image", "namespace", "nerdui"] }
        action: { type: string, examples: ["create", "exit", "connected"] }
        id: { type: string, description: Container ID for container/task events, name for image/namespace events }
        attributes:
          type: object
          additionalProperties: { type: string }
          description: e.g. image, runtime, pid, exitStatus, execId
    StreamMessage:
      type: object
      description: WebSocket text-frame envelope (ADR-0007)
      required: [type, ts]
      properties:
        type: { type: string, enum: [data, error, end] }
        data: {}
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
        ts: { type: string, format: date-time }
    User:
      type: object
      required: [id, username, role, mustChangePassword, mfaEnabled, sso]
      properties:
        mfaEnabled: { type: boolean, description: Signs in with a second factor (#75) }
        sso: { type: boolean, description: Linked to an account at the single sign-on provider (#76) }
        id: { type: integer, format: int64 }
        username: { type: string }
        role: { type: string, description: "admin, editor, operator, viewer or a custom role (ADR-0058)" }
        mustChangePassword:
          type: boolean
          description: |
            A temporary password is pending: every other endpoint answers 403
            `password_change_required` until `POST /auth/password` succeeds.
    OIDCStatus:
      type: object
      required: [enabled, buttonLabel]
      properties:
        enabled: { type: boolean }
        buttonLabel: { type: string }
    OIDCSettings:
      type: object
      properties:
        enabled: { type: boolean }
        issuer: { type: string, description: "Issuer URL, e.g. https://keycloak.example.com/realms/main" }
        clientId: { type: string }
        clientSecret: { type: string, writeOnly: true, description: Replaces the stored secret; "" removes it }
        hasClientSecret: { type: boolean, readOnly: true }
        scopes: { type: [array, "null"], items: { type: string }, description: "Besides openid; default profile, email (and groups with group)" }
        usernameClaim: { type: string, description: Default preferred_username }
        groupsClaim: { type: string, description: Default groups }
        group: { type: string, description: "Required to sign in; its members without an account get one. Empty: only existing accounts" }
        role: { type: string, description: "Role of accounts created at the first sign-in; default viewer (admin for settings saved before roles)" }
        buttonLabel: { type: string, description: Default "Sign in with SSO" }
        redirectUrl: { type: string, description: Overrides the callback URL derived from the request }
        callbackUrl: { type: string, readOnly: true, description: The callback URL to register at the provider }
    UserDetail:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [disabled, createdAt]
          properties:
            disabled: { type: boolean }
            createdAt: { type: string, format: date-time }
            lastLoginAt: { type: string, format: date-time }
    UserPasswordResponse:
      type: object
      properties:
        user: { $ref: "#/components/schemas/UserDetail" }
        generatedPassword:
          type: string
          description: Present only when the server generated the password; shown once
    SessionResponse:
      type: object
      required: [user, csrfToken, expiresAt, mfaSetupRequired, permissions]
      properties:
        user: { $ref: "#/components/schemas/User" }
        csrfToken: { type: string }
        expiresAt: { type: string, format: date-time }
        mfaSetupRequired:
          type: boolean
          description: Two-factor authentication is required and the user has not set it up yet
        permissions:
          type: array
          items: { $ref: "#/components/schemas/Permission" }
          description: |
            What the caller may do: the actions of the user's role, limited by the API key of the
            request (ADR-0058). The UI hides the rest; the server checks every request.
    Role:
      type: object
      required: [name, description, builtin, permissions, users]
      properties:
        name: { type: string, pattern: "^[a-z][a-z0-9-]{0,31}$" }
        description: { type: string, maxLength: 200 }
        builtin: { type: boolean, description: admin, editor, operator and viewer cannot be changed }
        permissions: { type: array, items: { $ref: "#/components/schemas/Permission" } }
        users: { type: integer, format: int64, description: Users with the role }
    RoleInput:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, description: Only when creating }
        description: { type: string, maxLength: 200 }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/Permission" }
          description: The caller must have each of them; jobs:read is always added
    MFAChallenge:
      type: object
      required: [mfaRequired, mfaToken, totp, passkey]
      properties:
        mfaRequired: { type: boolean, const: true }
        mfaToken: { type: string }
        totp: { type: boolean, description: The user has an authenticator app }
        passkey: { type: boolean, description: The user has passkeys }
    MFAStatus:
      type: object
      required: [enabled, totp, passkeys, backupCodesLeft, required]
      properties:
        enabled: { type: boolean, description: An authenticator app or a passkey }
        totp: { type: boolean, description: The authenticator app is set up }
        passkeys: { type: integer }
        backupCodesLeft: { type: integer }
        required: { type: boolean, description: The administrator requires it from every user }
    Passkey:
      type: object
      required: [id, name, host, createdAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        host: { type: string, description: The host name the passkey is bound to }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
    PasskeyOptions:
      type: object
      required: [options]
      properties:
        token: { type: string, description: Sent back with the answer (not for the second step) }
        options:
          type: object
          description: The JSON form of the WebAuthn options, with a `publicKey` member
          required: [publicKey]
          properties:
            publicKey: { type: object, additionalProperties: true }
    PasskeyCredential:
      type: object
      description: The JSON form of a PublicKeyCredential (`credential.toJSON()`)
      required: [id, rawId, type, response]
      additionalProperties: true
      properties:
        id: { type: string }
        rawId: { type: string }
        type: { type: string, const: public-key }
        response: { type: object, additionalProperties: true }
    SecuritySettings:
      type: object
      required: [requireMfa]
      additionalProperties: false
      properties:
        requireMfa: { type: boolean }
    Error:
      type: object
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/ErrorDetail" }
    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [invalid_argument, unauthenticated, forbidden, csrf_failed, not_found, conflict,
                 rate_limited, unsupported_media_type, internal, unavailable, nerdctl_incompatible,
                 password_change_required]
        message: { type: string }
    ContainerInspect:
      type: object
      description: "`nerdctl inspect` output (Docker-compatible). Other fields may be present."
      additionalProperties: true
      required: [Id, Name]
      properties:
        Id: { type: string }
        Name: { type: string }
        Created: { type: string }
        Path: { type: string }
        Args: { type: [array, "null"], items: { type: string } }
        Image: { type: string }
        RestartCount: { type: integer }
        Platform: { type: string }
        State:
          type: [object, "null"]
          additionalProperties: true
          properties:
            Status: { type: string }
            Pid: { type: integer }
            ExitCode: { type: integer }
            Error: { type: string }
            StartedAt: { type: string }
            FinishedAt: { type: string }
            Health:
              type: [object, "null"]
              description: Healthcheck state with the last results, newest first (#22).
              additionalProperties: true
              properties:
                Status: { type: string, description: "starting, healthy or unhealthy" }
                FailingStreak: { type: integer }
                Log:
                  type: [array, "null"]
                  items:
                    type: object
                    additionalProperties: true
                    properties:
                      Start: { type: string }
                      End: { type: string }
                      ExitCode: { type: integer }
                      Output: { type: string }
        HostConfig:
          type: [object, "null"]
          additionalProperties: true
          properties:
            NetworkMode: { type: string }
            RestartPolicy:
              type: object
              additionalProperties: true
              properties:
                Name: { type: string }
                MaximumRetryCount: { type: integer }
        Mounts:
          type: [array, "null"]
          items:
            type: object
            additionalProperties: true
            properties:
              Type: { type: string }
              Name: { type: string }
              Source: { type: string }
              Destination: { type: string }
              Mode: { type: string }
              RW: { type: boolean }
        Config:
          type: [object, "null"]
          additionalProperties: true
          properties:
            Hostname: { type: string }
            User: { type: string }
            WorkingDir: { type: string }
            Env: { type: array, items: { type: string } }
            Cmd: { type: array, items: { type: string } }
            Entrypoint: { type: array, items: { type: string } }
            Labels: { type: object, additionalProperties: { type: string } }
            Healthcheck:
              type: [object, "null"]
              description: Healthcheck configuration; durations in nanoseconds.
              additionalProperties: true
              properties:
                Test: { type: [array, "null"], items: { type: string } }
                Interval: { type: integer }
                Timeout: { type: integer }
                Retries: { type: integer }
                StartPeriod: { type: integer }
        NetworkSettings:
          type: [object, "null"]
          additionalProperties: true
          properties:
            Ports:
              type: [object, "null"]
              additionalProperties:
                type: [array, "null"]
                items:
                  type: object
                  properties:
                    HostIp: { type: string }
                    HostPort: { type: string }
            Networks:
              type: [object, "null"]
              additionalProperties:
                type: object
                additionalProperties: true
                properties:
                  IPAddress: { type: string }
                  IPPrefixLen: { type: integer }
                  GlobalIPv6Address: { type: string }
                  MacAddress: { type: string }
    SystemInfo:
      type: object
      required: [id, hostname, operatingSystem, osType, architecture, kernelVersion, cpus,
        memoryBytes, cgroupDriver, cgroupVersion, rootless, snapshotter, snapshotters,
        logDrivers, securityOptions, features, components, cni, warnings, deprecations, plugins]
      properties:
        id: { type: string, description: containerd server UUID }
        hostname: { type: string }
        operatingSystem: { type: string, description: "Distribution, e.g. Ubuntu 24.04.2 LTS" }
        osType: { type: string, example: linux }
        architecture: { type: string, example: x86_64 }
        kernelVersion: { type: string }
        cpus: { type: integer }
        memoryBytes: { type: integer, format: int64 }
        cgroupDriver: { type: string, example: systemd }
        cgroupVersion: { type: string, example: "2" }
        rootless: { type: boolean }
        snapshotter: { type: string, description: nerdctl default snapshotter }
        snapshotters: { type: array, items: { type: string }, description: Snapshotters loaded by containerd }
        logDrivers: { type: array, items: { type: string } }
        securityOptions: { type: array, items: { type: string } }
        features:
          type: object
          required: [memoryLimit, swapLimit, cpuCfsPeriod, cpuCfsQuota, cpuShares, cpuSet,
            pidsLimit, oomKillDisable, ipv4Forwarding]
          properties:
            memoryLimit: { type: boolean }
            swapLimit: { type: boolean }
            cpuCfsPeriod: { type: boolean }
            cpuCfsQuota: { type: boolean }
            cpuShares: { type: boolean }
            cpuSet: { type: boolean }
            pidsLimit: { type: boolean }
            oomKillDisable: { type: boolean }
            ipv4Forwarding: { type: boolean }
        components:
          type: array
          description: containerd, runc and buildctl
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
              version: { type: string }
              commit: { type: string }
              error: { type: string, description: Why the version is unknown }
        cni:
          type: object
          required: [path, netConfPath, plugins]
          properties:
            path: { type: string, description: CNI plugin directory }
            netConfPath: { type: string }
            version: { type: string, description: Version of the bridge plugin }
            plugins: { type: array, items: { type: string } }
            error: { type: string }
        warnings: { type: array, items: { type: string } }
        deprecations:
          type: array
          items:
            type: object
            required: [id, message]
            properties:
              id: { type: string }
              message: { type: string }
              lastOccurrence: { type: string, format: date-time }
        plugins:
          type: array
          items:
            type: object
            required: [type, id, status]
            properties:
              type: { type: string, example: io.containerd.snapshotter.v1 }
              id: { type: string, example: overlayfs }
              platforms: { type: array, items: { type: string } }
              capabilities: { type: array, items: { type: string } }
              status: { type: string, enum: [ok, skip, error] }
              error: { type: string, description: Init error (also for skipped plugins) }
    Image:
      type: object
      required: [name, repository, tag, digest, createdAt, platforms, size, contentSize, containers, labels]
      properties:
        name: { type: string, examples: ["docker.io/library/nginx:1.27"] }
        repository:
          type: string
          description: Short repository name (`nginx`); empty for digest-only (dangling) images
        tag: { type: string, description: Empty for digest references and dangling images }
        digest: { type: string, description: Target (index or manifest) digest }
        createdAt: { type: string, format: date-time, description: When the image was stored }
        platforms:
          type: array
          items: { type: string }
          description: Platforms whose content is in the store, e.g. linux/amd64
        size: { type: integer, format: int64, description: Unpacked size on disk (snapshots), bytes }
        contentSize: { type: integer, format: int64, description: Stored compressed content, bytes }
        containers: { type: integer, description: Containers of the namespace created from this image }
        labels: { type: object, additionalProperties: { type: string } }
    PrunedItem:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        size: { type: integer, format: int64 }
    PrunePreview:
      type: object
      required: [containers, images, imagesSize, buildKit]
      properties:
        containers: { type: array, items: { $ref: "#/components/schemas/PrunedItem" } }
        images: { type: array, items: { $ref: "#/components/schemas/PrunedItem" } }
        imagesSize: { type: integer, format: int64, description: Sum of unpacked sizes (upper bound) }
        buildKit: { type: boolean, description: A BuildKit daemon is available for build cache pruning }
    Registry:
      type: object
      required: [server]
      properties:
        server: { type: string, description: "Key in the docker config, e.g. https://index.docker.io/v1/" }
        username: { type: string }
        aliases:
          type: array
          items: { type: string }
          description: Other keys of the same login (nerdctl stores port 443 with and without the port); logout removes all
    HistoryEvent:
      type: object
      required: [id, ts, topic, kind, action]
      properties:
        id: { type: integer, format: int64 }
        ts: { type: string, format: date-time }
        namespace: { type: string }
        topic: { type: string, examples: ["/tasks/exit"] }
        kind: { type: string, examples: ["container", "task", "image", "nerdui"] }
        action: { type: string, examples: ["create", "exit", "oom"] }
        objectId: { type: string }
        objectName: { type: string, description: Container name at the time of the event }
        attributes: { type: object, additionalProperties: { type: string } }
    VolumeEntry:
      type: object
      required: [name, type, size, mode, modTime]
      properties:
        name: { type: string }
        type: { type: string, enum: [dir, file, symlink, other] }
        size: { type: integer, format: int64 }
        mode: { type: string, examples: ["-rw-r--r--"] }
        modTime: { type: string, format: date-time }
        target: { type: string, description: Target of a symlink }
        targetType: { type: string, enum: [dir, file], description: Type of a symlink's target inside the volume }
    CreateContainerRequest:
      type: object
      required: [image]
      additionalProperties: false
      properties:
        image: { type: string, examples: ["nginx:1.27"] }
        name: { type: string }
        entrypoint: { type: string }
        command: { type: array, items: { type: string } }
        ports:
          type: array
          items:
            type: object
            required: [containerPort]
            properties:
              hostIp: { type: string }
              hostPort: { type: integer, description: 0 or absent = random }
              containerPort: { type: integer }
              protocol: { type: string, enum: [tcp, udp] }
        env:
          type: array
          items:
            type: object
            required: [name, value]
            properties:
              name: { type: string }
              value: { type: string }
        mounts:
          type: array
          items:
            type: object
            required: [type, target]
            properties:
              type: { type: string, enum: [volume, bind, tmpfs] }
              source: { type: string, description: "Volume name (empty = anonymous) or absolute host path" }
              target: { type: string }
              readOnly: { type: boolean }
        network: { type: string, examples: ["bridge", "host", "none"] }
        hostname: { type: string }
        user: { type: string }
        workdir: { type: string }
        cpus: { type: number }
        memoryBytes: { type: integer, format: int64 }
        restart: { type: string, examples: ["no", "always", "unless-stopped", "on-failure:3"] }
        labels: { type: object, additionalProperties: { type: string } }
        start: { type: boolean, description: Start after creating (like nerdctl run -d) }
        extraNetworks:
          type: array
          items: { type: string }
          description: More networks after `network` (#18)
        ip: { type: string, description: Static IPv4 address in the first network }
        privileged: { type: boolean }
        capAdd: { type: array, items: { type: string }, examples: [["NET_ADMIN"]] }
        capDrop: { type: array, items: { type: string } }
        devices:
          type: array
          items: { type: string }
          description: "host[:container[:permissions]], as --device"
          examples: [["/dev/net/tun", "/dev/dri:/dev/dri:rw"]]
        dns: { type: array, items: { type: string }, description: DNS server addresses }
        extraHosts:
          type: array
          items: { type: string }
          description: "name:address entries for /etc/hosts; the address may be host-gateway"
        healthcheck:
          type: object
          additionalProperties: false
          description: |
            Overrides the image's healthcheck (#237). Durations are Go durations such as `30s`;
            empty values keep the image's settings, else 30s interval and timeout and 3 retries.
          properties:
            command: { type: string, description: Runs with /bin/sh -c in the container (--health-cmd) }
            interval: { type: string, examples: ["30s"] }
            timeout: { type: string, examples: ["5s"] }
            startPeriod: { type: string, examples: ["1m"] }
            retries: { type: integer, minimum: 0, maximum: 100 }
            disabled: { type: boolean, description: Turns off the image's healthcheck; no other field may be set }
    Job:
      type: object
      required: [id, kind, title, environment, status, startedAt]
      properties:
        id: { type: string }
        kind: { type: string, examples: ["image.pull"] }
        title: { type: string, examples: ["Pull nginx:1.27"] }
        environment: { type: string }
        namespace: { type: string }
        resource: { type: string, description: Lock key; one running job per resource }
        user: { type: string, description: Who started the job }
        status: { type: string, enum: [running, succeeded, failed, canceled] }
        error: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        result:
          type: object
          additionalProperties: { type: string }
          description: Values the job set, e.g. containerId of a created container
    JobFrame:
      type: object
      properties:
        job: { $ref: "#/components/schemas/Job" }
        output: { type: string, description: Terminal output (ANSI) }
        reset: { type: boolean, description: "output is the whole stored screen: clear first" }
    StatsSample:
      type: object
      required: [ts, cpuPercent, memoryUsage, memoryLimit, memoryPercent, networkRx, networkTx, blockRead, blockWrite, pids]
      properties:
        ts: { type: string, format: date-time }
        cpuPercent: { type: number, description: "Relative to one CPU: 200 = two CPUs busy" }
        memoryUsage: { type: integer, format: int64 }
        memoryLimit: { type: integer, format: int64, description: Container limit, or host memory }
        memoryPercent: { type: number }
        networkRx: { type: integer, format: int64, description: Cumulative bytes }
        networkTx: { type: integer, format: int64 }
        blockRead: { type: integer, format: int64, description: Cumulative bytes }
        blockWrite: { type: integer, format: int64 }
        pids: { type: integer, format: int64 }
    Preferences:
      type: object
      required: [theme, dateFormat, refreshSeconds]
      additionalProperties: false
      properties:
        theme: { type: string, enum: [auto, light, dark] }
        dateFormat: { type: string, enum: [relative, local, iso] }
        refreshSeconds: { type: integer, enum: [0, 5, 10, 30, 60], description: Poll lists in addition to live events; 0 is off }
        hiddenColumns:
          type: object
          additionalProperties: { type: array, items: { type: string } }
          description: Hidden columns per table
    APIKey:
      type: object
      required: [id, name, prefix, readOnly, createdAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        prefix: { type: string, description: The start of the key, to tell keys apart }
        readOnly: { type: boolean }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/Permission" }
          description: The key may only perform these actions (#80); absent, everything its user may do
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
    Permission:
      type: string
      description: An authorization action (ADR-0009)
      enum: [jobs:read, containers:read, containers:operate, containers:write, containers:exec, images:read, images:write, volumes:read, volumes:write, networks:read, networks:write, stacks:read, stacks:write, stacks:deploy, namespaces:read, namespaces:write, system:read, system:prune, registries:read, registries:write, users:read, users:write, settings:read, settings:write, audit:read]
    GitCommit:
      type: object
      required: [hash, message, author, date]
      properties:
        hash: { type: string }
        message: { type: string, description: First line of the commit message }
        author: { type: string }
        date: { type: string, format: date-time }
    GitInfo:
      type: object
      description: The repository of a Git stack (#37)
      required: [url, ref, fullRef, composePath, commit, pulledAt, autoUpdate, pollInterval, webhook]
      properties:
        url: { type: string }
        ref: { type: string, description: Branch or tag as entered; empty for the default branch }
        fullRef: { type: string, example: refs/heads/main }
        composePath: { type: string, description: Compose file relative to the repository root }
        credentialId: { type: integer, format: int64 }
        commit: { $ref: "#/components/schemas/GitCommit" }
        pulledAt: { type: string, format: date-time }
        lastError: { type: string, description: Error of the newest failed pull or check }
        autoUpdate: { type: string, enum: ["off", notify, deploy], description: What happens on a new commit found by polling or the webhook }
        pollInterval: { type: integer, format: int64, description: Seconds between checks of the remote; 0 without polling }
        webhook: { type: boolean, description: The stack has a webhook }
        checkedAt: { type: string, format: date-time, description: Last check of the remote }
        remoteCommit: { type: string, description: Newest remote commit when it is not checked out }
    GitAutoRequest:
      type: object
      required: [autoUpdate, pollInterval]
      additionalProperties: false
      properties:
        autoUpdate: { type: string, enum: ["off", notify, deploy] }
        pollInterval: { type: integer, format: int64, enum: [0, 60, 300, 900, 3600, 21600, 86400] }
    GitWebhookResult:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [accepted, ignored, pong] }
        reason: { type: string }
    GitStackRequest:
      type: object
      required: [name, url]
      additionalProperties: false
      properties:
        name: { type: string }
        url: { type: string, description: "https://, http://, ssh:// or git@host:path" }
        ref: { type: string, description: Branch or tag; empty for the default branch }
        composePath: { type: string, description: Compose file or its directory, relative to the repository root }
        credentialId: { type: integer, format: int64 }
        deploy: { type: boolean, description: Run compose up after cloning }
    GitCredential:
      type: object
      required: [id, name, kind, passphrase, stacks, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        kind: { type: string, enum: [token, ssh] }
        username: { type: string }
        publicKey: { type: string, description: Public key of an SSH credential, to add as a deploy key }
        passphrase: { type: boolean, description: The SSH key is encrypted with a stored passphrase }
        stacks: { type: integer, format: int64, description: Git stacks using it }
        updatedAt: { type: string, format: date-time }
    GitCredentialInput:
      type: object
      required: [name, kind]
      additionalProperties: false
      properties:
        name: { type: string }
        kind: { type: string, enum: [token, ssh] }
        username: { type: string, description: "HTTPS user name (default git) or SSH user (default git)" }
        secret: { type: string, writeOnly: true, description: Token or password, or a PEM private key; empty keeps the stored one }
        passphrase: { type: string, writeOnly: true }
        generate: { type: boolean, description: Generate a new ed25519 SSH key }
    Process:
      type: object
      required: [pid, ppid, uid, state, cpu, rss, started, command]
      properties:
        pid: { type: integer }
        ppid: { type: integer }
        uid: { type: integer, description: Real user ID on the host; -1 when unknown }
        user: { type: string, description: User name on the host }
        state: { type: string, description: "Kernel state: R running, S sleeping, D disk sleep, Z zombie, T stopped" }
        cpu: { type: number, description: Percent of one CPU since the process started }
        rss: { type: integer, format: int64, description: Resident memory in bytes }
        started: { type: string, format: date-time }
        command: { type: string }
    ImageHistoryEntry:
      type: object
      required: [createdBy, emptyLayer, size]
      properties:
        created: { type: string, format: date-time }
        createdBy: { type: string, description: The instruction that made this step }
        comment: { type: string }
        emptyLayer: { type: boolean, description: The step added no layer (ENV, CMD, …) }
        size: { type: integer, format: int64, description: Layer size in bytes }
        compressed: { type: boolean, description: The size is the compressed size; the image is not unpacked }
    Webhook:
      type: object
      required: [id, name, environment, namespace, targetKind, target, action, enabled, createdAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        environment: { type: string }
        namespace: { type: string }
        targetKind: { type: string, enum: [stack, container] }
        target: { type: string, description: Stack or container name }
        action: { type: string, enum: [redeploy, restart] }
        enabled: { type: boolean }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        lastCalledAt: { type: string, format: date-time }
        lastJob: { type: string, description: Job of the newest call }
        lastError: { type: string, description: Why the newest call could not start }
    WebhookInput:
      type: object
      required: [name, environment, namespace, targetKind, target, action, enabled]
      additionalProperties: false
      properties:
        name: { type: string }
        environment: { type: string }
        namespace: { type: string }
        targetKind: { type: string, enum: [stack, container] }
        target: { type: string }
        action:
          type: string
          enum: [redeploy, restart]
          description: "redeploy: pull images and recreate; restart: restart as is"
        enabled: { type: boolean }
    GitKnownHost:
      type: object
      required: [host, type, fingerprint, addedAt]
      properties:
        host: { type: string, example: "github.com:22" }
        type: { type: string, example: ssh-ed25519 }
        fingerprint: { type: string, example: "SHA256:..." }
        addedAt: { type: string, format: date-time }
    StackFile:
      type: object
      required: [kind, name, content, version, exists]
      properties:
        kind: { type: string, enum: [compose, env] }
        name: { type: string, description: File name in the stack directory }
        content: { type: string }
        version: { type: string, description: SHA-256 of the content; empty when the file does not exist }
        exists: { type: boolean }
    StackValidation:
      type: object
      required: [valid, services]
      properties:
        valid: { type: boolean }
        error: { type: string }
        line: { type: integer, description: Line of the error in the compose file, when known }
        services: { type: array, items: { type: string } }
    StackTree:
      type: object
      required: [entries, truncated, readOnly]
      properties:
        entries:
          type: array
          items:
            type: object
            required: [path, dir, size]
            properties:
              path: { type: string, description: Relative to the stack's directory, with slashes }
              dir: { type: boolean }
              size: { type: integer, format: int64 }
              protected: { type: boolean, description: The compose file, which cannot be deleted }
        truncated: { type: boolean }
        readOnly: { type: boolean, description: The files of a Git stack come from its repository }
    StackPathFile:
      type: object
      required: [path, content, version, exists, size]
      properties:
        path: { type: string }
        content: { type: string }
        version: { type: string, description: SHA-256 of the content; empty when the file does not exist }
        exists: { type: boolean }
        size: { type: integer, format: int64 }
        binary: { type: boolean, description: Not text; not shown or edited }
        tooBig: { type: boolean, description: Larger than 1 MiB; not shown or edited }
    Stack:
      type: object
      required: [name, mode, status, services, containers, running]
      properties:
        name: { type: string }
        mode: { type: string, enum: [managed, external, git, unmanaged] }
        path: { type: string }
        composeFile: { type: string }
        git: { $ref: "#/components/schemas/GitInfo" }
        status: { type: string, enum: [running, partial, stopped, unknown] }
        error: { type: string, description: Why the compose file could not be read }
        containers: { type: integer }
        running: { type: integer }
        services:
          type: array
          items:
            type: object
            required: [name, defined, running, containers]
            properties:
              name: { type: string }
              defined: { type: boolean, description: False when the service is not in the compose file }
              running: { type: integer }
              containers:
                type: array
                items:
                  type: object
                  required: [id, state]
                  properties:
                    id: { type: string }
                    name: { type: string }
                    state: { type: string }
    ContainerCounts:
      type: object
      required: [total, running, paused, stopped, unhealthy]
      properties:
        total: { type: integer }
        running: { type: integer }
        paused: { type: integer }
        stopped: { type: integer }
        unhealthy: { type: integer }
    Summary:
      type: object
      required: [containers, images, volumes, networks, stacks, namespaces, imagesSize, filesystems]
      properties:
        containers: { $ref: "#/components/schemas/ContainerCounts" }
        images: { type: integer }
        volumes: { type: integer }
        networks: { type: integer }
        stacks: { type: integer }
        namespaces:
          type: array
          items:
            type: object
            required: [name, containers, images, volumes, networks]
            properties:
              name: { type: string }
              containers: { $ref: "#/components/schemas/ContainerCounts" }
              images: { type: integer }
              volumes: { type: integer }
              networks: { type: integer }
        imagesSize: { type: integer, format: int64 }
        volumesSize: { type: integer, format: int64, description: Only with volumeSizes=true }
        filesystems:
          type: array
          items:
            type: object
            required: [paths, total, free]
            properties:
              paths: { type: array, items: { type: string } }
              total: { type: integer, format: int64 }
              free: { type: integer, format: int64 }
    TopContainer:
      type: object
      required: [id, namespace, cpuPercent, memoryUsage, memoryPercent]
      properties:
        id: { type: string }
        name: { type: string }
        namespace: { type: string }
        cpuPercent: { type: number }
        memoryUsage: { type: integer, format: int64 }
        memoryPercent: { type: number }
    TopStats:
      type: object
      required: [ts, running, cpu, memory]
      properties:
        ts: { type: string, format: date-time }
        running: { type: integer }
        cpu: { type: array, items: { $ref: "#/components/schemas/TopContainer" } }
        memory: { type: array, items: { $ref: "#/components/schemas/TopContainer" } }
    PortEntry:
      type: object
      required: [namespace, containerId, state, containerPort, protocol, published]
      properties:
        namespace: { type: string }
        containerId: { type: string }
        containerName: { type: string }
        state: { type: string }
        hostIp: { type: string }
        hostPort: { type: integer }
        containerPort: { type: integer }
        protocol: { type: string }
        published: { type: boolean, description: False for ports only exposed by the image }
        conflicts: { type: array, items: { type: string } }
    Network:
      type: object
      required: [name, driver, labels, ipam, internal, default, removable, containers]
      properties:
        name: { type: string }
        id: { type: string }
        driver: { type: string, examples: [bridge, macvlan, ipvlan] }
        labels: { type: object, additionalProperties: { type: string } }
        ipam:
          type: array
          items:
            type: object
            properties:
              subnet: { type: string }
              gateway: { type: string }
              rangeStart: { type: string }
              rangeEnd: { type: string }
        parent: { type: string, description: Host interface of a macvlan or ipvlan network }
        internal: { type: boolean }
        default: { type: boolean }
        removable: { type: boolean }
        file: { type: string }
        containers:
          type: array
          items:
            type: object
            required: [id, running]
            properties:
              id: { type: string }
              name: { type: string }
              running: { type: boolean }
              ips: { type: array, items: { type: string } }
              mac: { type: string }
    NetworkSpec:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string }
        driver: { type: string, enum: [bridge, macvlan, ipvlan] }
        subnet: { type: string, examples: ["10.20.0.0/24"] }
        gateway: { type: string }
        ipRange: { type: string, examples: ["10.20.0.128/25"] }
        parent: { type: string, description: Required for macvlan and ipvlan }
        internal: { type: boolean, description: Bridge only; no outside access }
        labels: { type: object, additionalProperties: { type: string } }
    Volume:
      type: object
      required: [name, mountpoint, labels, anonymous, containers]
      properties:
        name: { type: string }
        mountpoint: { type: string }
        labels: { type: object, additionalProperties: { type: string } }
        anonymous: { type: boolean, description: Created for a container without a name }
        createdAt: { type: string, format: date-time, description: Modification time of the volume directory }
        size: { type: integer, format: int64, description: Bytes; only with size=true }
        containers:
          type: array
          items:
            type: object
            required: [id]
            properties:
              id: { type: string }
              name: { type: string }
    StatsHistory:
      type: object
      description: Points on a common time axis; null is a gap.
      required: [range, step, times, cpu, memory, memoryLimit, blockRead, blockWrite, pids]
      properties:
        range: { type: string }
        step: { type: integer, description: Seconds between points }
        times: { type: array, items: { type: integer, format: int64 }, description: Unix seconds }
        cpu: { type: array, items: { type: [number, "null"] }, description: "Percent of one CPU" }
        memory: { type: array, items: { type: [number, "null"] }, description: Bytes without inactive file cache }
        memoryLimit: { type: array, items: { type: [number, "null"] }, description: "Bytes; null when unlimited" }
        blockRead: { type: array, items: { type: [number, "null"] }, description: Bytes per second }
        blockWrite: { type: array, items: { type: [number, "null"] } }
        pids: { type: array, items: { type: [number, "null"] } }
    PrometheusSettings:
      type: object
      required: [configured, hasSecret]
      properties:
        configured: { type: boolean }
        url: { type: string }
        auth: { type: string, enum: [none, basic, bearer] }
        username: { type: string }
        hasSecret: { type: boolean }
    PrometheusSettingsInput:
      type: object
      required: [url, auth]
      additionalProperties: false
      properties:
        url: { type: string, description: "Base URL, e.g. http://127.0.0.1:9090" }
        auth: { type: string, enum: [none, basic, bearer] }
        username: { type: string }
        secret: { type: string, description: Password or token; empty keeps the stored one }
    StackLogLine:
      allOf:
        - $ref: "#/components/schemas/LogLine"
        - type: object
          required: [service, containerId]
          properties:
            service: { type: string }
            container: { type: string }
            containerId: { type: string }
    LogLine:
      type: object
      required: [stream, line]
      properties:
        stream: { type: string, enum: [stdout, stderr] }
        ts:
          type: string
          format: date-time
          description: Absent when the log driver does not record times (journald)
        line: { type: string, description: Line without the newline; ANSI sequences preserved }
    ContainerActionName:
      type: string
      enum: [start, stop, restart, kill, pause, unpause, remove]
    BulkActionRequest:
      type: object
      required: [action, ids]
      additionalProperties: false
      properties:
        action: { $ref: "#/components/schemas/ContainerActionName" }
        ids:
          type: array
          minItems: 1
          maxItems: 200
          items: { type: string }
        force: { type: boolean, description: "remove only: kill running containers first" }
        volumes: { type: boolean, description: "remove only: also remove anonymous volumes" }
    BulkActionResult:
      type: object
      required: [id, ok]
      properties:
        id: { type: string }
        ok: { type: boolean }
        error: { $ref: "#/components/schemas/ErrorDetail" }

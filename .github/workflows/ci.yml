name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Check generated API types are up to date
        run: |
          npm run api:gen
          git diff --exit-code -- src/api/schema.d.ts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  go:
    name: Go (lint, test, build)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.6
      - run: go test -race -coverprofile=coverage.out ./...
      - name: Build linux/amd64 and linux/arm64
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o bin/nerdui-linux-amd64 ./cmd/nerdui
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o bin/nerdui-linux-arm64 ./cmd/nerdui

  licenses:
    name: Licenses (SPDX headers, dependency licenses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: make spdx-check
      - run: make licenses-check

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod

  integration:
    name: Integration (containerd + nerdctl)
    runs-on: ubuntu-latest
    needs: go
    env:
      NERDCTL_VERSION: "2.4.2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install nerdctl-full (containerd, runc, CNI, BuildKit)
        run: |
          arch=$(dpkg --print-architecture)
          url="https://github.com/containerd/nerdctl/releases/download/v${NERDCTL_VERSION}/nerdctl-full-${NERDCTL_VERSION}-linux-${arch}.tar.gz"
          curl -fsSL "$url" -o /tmp/nerdctl-full.tar.gz
          sudo tar -C /usr/local -xzf /tmp/nerdctl-full.tar.gz
          # Replace the runner's Docker-bundled containerd with the nerdctl-full one.
          sudo systemctl stop docker.socket docker.service || true
          sudo systemctl daemon-reload
          sudo systemctl restart containerd
          sudo nerdctl version
      - name: Smoke test with nerdctl
        run: sudo nerdctl run --rm docker.io/library/alpine:3 echo ok
      - name: Run integration tests
        run: sudo -E env "PATH=$PATH" go test -race -tags integration -count=1 ./...

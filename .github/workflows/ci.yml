name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Check generated API types are up to date
        run: |
          npm run api:gen
          git diff --exit-code -- src/api/schema.d.ts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  go:
    name: Go (lint, test, build)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: sqlc generated code is up to date
        run: make sqlc-check
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - run: go test -race -coverprofile=coverage.out ./...
      - name: Build linux/amd64 and linux/arm64
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o bin/nerdui-linux-amd64 ./cmd/nerdui
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o bin/nerdui-linux-arm64 ./cmd/nerdui

  licenses:
    name: Licenses (SPDX headers, dependency licenses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: make spdx-check
      - run: make licenses-check

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod

  integration:
    # Supported containerd versions: ADR-0012. Job names are required status checks.
    name: Integration (containerd ${{ matrix.containerd.minor }})
    runs-on: ubuntu-latest
    needs: go
    strategy:
      fail-fast: false
      matrix:
        containerd:
          - minor: "2.3"   # LTS
            version: "2.3.7"
          - minor: "2.4"   # bundled with nerdctl-full
            version: ""
    env:
      NERDCTL_VERSION: "2.4.2"
      CONTAINERD_VERSION: ${{ matrix.containerd.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install nerdctl-full (containerd, runc, CNI, BuildKit)
        run: |
          arch=$(dpkg --print-architecture)
          url="https://github.com/containerd/nerdctl/releases/download/v${NERDCTL_VERSION}/nerdctl-full-${NERDCTL_VERSION}-linux-${arch}.tar.gz"
          curl -fsSL "$url" -o /tmp/nerdctl-full.tar.gz
          sudo tar -C /usr/local -xzf /tmp/nerdctl-full.tar.gz
      - name: Override containerd ${{ matrix.containerd.version }}
        if: matrix.containerd.version != ''
        run: |
          arch=$(dpkg --print-architecture)
          url="https://github.com/containerd/containerd/releases/download/v${CONTAINERD_VERSION}/containerd-${CONTAINERD_VERSION}-linux-${arch}.tar.gz"
          curl -fsSL "$url" -o /tmp/containerd.tar.gz
          sudo tar -C /usr/local -xzf /tmp/containerd.tar.gz
      - name: Start containerd
        run: |
          # Replace the runner's Docker-bundled containerd with the one installed above.
          sudo systemctl stop docker.socket docker.service || true
          sudo systemctl daemon-reload
          sudo systemctl restart containerd
          sudo nerdctl version
      - name: Smoke test with nerdctl
        run: sudo nerdctl run --rm docker.io/library/alpine:3 echo ok
      - name: Run integration tests
        env:
          NERDUI_TEST_EXPECT_CONTAINERD: v${{ matrix.containerd.minor }}.
          NERDUI_TEST_RESTART_CONTAINERD: "1"
        # Only TestIntegration* (unit tests run in the Go job), verbose to show measurements.
        # -p 1: the events test restarts containerd, packages must not run concurrently.
        # sudo drops the step environment on GitHub runners: pass test variables explicitly.
        run: >-
          sudo env "PATH=$PATH" "HOME=$HOME"
          "NERDUI_TEST_EXPECT_CONTAINERD=$NERDUI_TEST_EXPECT_CONTAINERD"
          "NERDUI_TEST_RESTART_CONTAINERD=$NERDUI_TEST_RESTART_CONTAINERD"
          go test -p 1 -race -tags integration -count=1 -run Integration -v ./...

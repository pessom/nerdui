name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Check generated API types are up to date
        run: |
          npm run api:gen
          git diff --exit-code -- src/api/schema.d.ts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Generated route tree is up to date
        run: git diff --exit-code -- src/routeTree.gen.ts
      - name: Bundle budget (initial JS ≤ 500 KB gzip, ADR-0010)
        run: npm run check:bundle
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  go:
    name: Go (lint, test, build)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: sqlc generated code is up to date
        run: make sqlc-check
      - name: nerdctl build modfiles are up to date (ADR-0017)
        run: make modfiles-check
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - run: go test -race -coverprofile=coverage.out ./...
      - name: Build linux/amd64 and linux/arm64
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o bin/nerdui-linux-amd64 ./cmd/nerdui
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o bin/nerdui-linux-arm64 ./cmd/nerdui
      # Older nerdctl builds (ADR-0017): same code, go.nerdctl-<minor>.mod.
      - name: Vet, test and build with nerdctl 2.3
        env:
          GOFLAGS: -modfile=go.nerdctl-2.3.mod
        run: |
          go vet ./...
          GOOS=linux go vet -tags integration ./...
          go test -race ./...
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o bin/nerdui-nerdctl2.3-linux-amd64 ./cmd/nerdui
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o bin/nerdui-nerdctl2.3-linux-arm64 ./cmd/nerdui

  licenses:
    name: Licenses (SPDX headers, dependency licenses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: make spdx-check
      - run: make licenses-check
      # go/packages-based tools reject -modfile: use the variant as go.mod in this workspace.
      - name: licenses-check (nerdctl 2.3 build)
        run: |
          cp go.nerdctl-2.3.mod go.mod && cp go.nerdctl-2.3.sum go.sum
          make licenses-check

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
      # go/packages-based tools reject -modfile: use the variant as go.mod in this workspace.
      - name: Use the nerdctl 2.3 modfile
        run: cp go.nerdctl-2.3.mod go.mod && cp go.nerdctl-2.3.sum go.sum
      - name: govulncheck (nerdctl 2.3 build)
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          repo-checkout: false

  release-config:
    name: GoReleaser config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

  integration:
    # nerdctl builds (ADR-0017) x supported containerd versions (ADR-0012), limited to the
    # containerd versions each nerdctl release supports. Job names are required status checks.
    name: Integration (nerdctl ${{ matrix.nerdctl.minor }}, containerd ${{ matrix.containerd.minor }})
    runs-on: ubuntu-latest
    needs: go
    strategy:
      fail-fast: false
      matrix:
        include:
          - nerdctl: { minor: "2.4", version: "2.4.2", goflags: "" }
            containerd: { minor: "2.3", version: "2.3.7" } # LTS
          - nerdctl: { minor: "2.4", version: "2.4.2", goflags: "" }
            containerd: { minor: "2.4", version: "" } # bundled with nerdctl-full
          - nerdctl: { minor: "2.3", version: "2.3.5", goflags: "-modfile=go.nerdctl-2.3.mod" }
            containerd: { minor: "2.3", version: "2.3.7" } # nerdctl 2.3 supports containerd <= 2.3
    env:
      NERDCTL_VERSION: ${{ matrix.nerdctl.version }}
      CONTAINERD_VERSION: ${{ matrix.containerd.version }}
      GOFLAGS: ${{ matrix.nerdctl.goflags }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install nerdctl-full (containerd, runc, CNI, BuildKit)
        run: |
          arch=$(dpkg --print-architecture)
          url="https://github.com/containerd/nerdctl/releases/download/v${NERDCTL_VERSION}/nerdctl-full-${NERDCTL_VERSION}-linux-${arch}.tar.gz"
          curl -fsSL "$url" -o /tmp/nerdctl-full.tar.gz
          sudo tar -C /usr/local -xzf /tmp/nerdctl-full.tar.gz
      - name: Override containerd ${{ matrix.containerd.version }}
        if: matrix.containerd.version != ''
        run: |
          arch=$(dpkg --print-architecture)
          url="https://github.com/containerd/containerd/releases/download/v${CONTAINERD_VERSION}/containerd-${CONTAINERD_VERSION}-linux-${arch}.tar.gz"
          curl -fsSL "$url" -o /tmp/containerd.tar.gz
          sudo tar -C /usr/local -xzf /tmp/containerd.tar.gz
      - name: Start containerd
        run: |
          # Replace the runner's Docker-bundled containerd with the one installed above.
          sudo systemctl stop docker.socket docker.service || true
          sudo systemctl daemon-reload
          sudo systemctl restart containerd
          sudo nerdctl version
      - name: Smoke test with nerdctl
        run: sudo nerdctl run --rm docker.io/library/alpine:3 echo ok
      - name: Run integration tests
        env:
          NERDUI_TEST_EXPECT_CONTAINERD: v${{ matrix.containerd.minor }}.
          NERDUI_TEST_RESTART_CONTAINERD: "1"
        # Only TestIntegration* (unit tests run in the Go job), verbose to show measurements.
        # -p 1: the events test restarts containerd, packages must not run concurrently.
        # sudo drops the step environment on GitHub runners: pass test variables explicitly.
        run: >-
          sudo env "PATH=$PATH" "HOME=$HOME"
          "NERDUI_TEST_EXPECT_CONTAINERD=$NERDUI_TEST_EXPECT_CONTAINERD"
          "NERDUI_TEST_RESTART_CONTAINERD=$NERDUI_TEST_RESTART_CONTAINERD"
          "GOFLAGS=$GOFLAGS"
          go test -p 1 -race -tags integration -count=1 -run Integration -v ./...
      - name: systemd unit (deploy/systemd)
        run: |
          CGO_ENABLED=0 go build -o /tmp/nerdui ./cmd/nerdui
          sudo install -m 0755 /tmp/nerdui /usr/local/bin/nerdui
          sudo install -m 0644 deploy/systemd/nerdui.service /etc/systemd/system/nerdui.service
          sudo install -m 0644 deploy/systemd/nerdui.env /etc/default/nerdui
          sudo systemctl daemon-reload
          sudo systemctl enable --now nerdui
          for i in $(seq 1 30); do sudo nerdui healthcheck >/dev/null 2>&1 && break; sleep 1; done
          sudo nerdui healthcheck
          systemctl is-active nerdui
          test "$(sudo stat -c %a /var/lib/nerdui)" = 700
          for i in $(seq 1 30); do sudo journalctl -u nerdui --no-pager | grep -q '"containerd connected"' && break; sleep 1; done
          sudo journalctl -u nerdui --no-pager | grep -q '"setup_token"'
          sudo journalctl -u nerdui --no-pager | grep -q '"nerdctl compatible"'
          # The build under test requires the nerdctl minor installed above.
          sudo journalctl -u nerdui --no-pager | grep '"nerdctl compatible"' | grep -q '"required":"${{ matrix.nerdctl.minor }}.x"'
          sudo journalctl -u nerdui --no-pager | grep -q '"containerd connected"'
          # nerdui survives a containerd restart and keeps serving.
          sudo systemctl restart containerd
          sleep 3
          systemctl is-active nerdui
          sudo nerdui healthcheck
      - name: nerdui logs
        if: always()
        run: sudo journalctl -u nerdui --no-pager | tail -50 || true

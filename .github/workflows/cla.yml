name: CLA

on:
  issue_comment:
    types: [created]
  # pull_request_target is required to post comments on PRs from forks.
  # It is safe here: the PR code is never checked out or executed.
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write # stores signatures in the cla-signatures branch
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/pessom/nerdui/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures
          allowlist: pessom,dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false

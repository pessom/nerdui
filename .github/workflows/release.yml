name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create GitHub release
  packages: write # push image to ghcr.io
  id-token: write # keyless cosign signing (Sigstore OIDC)

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - uses: sigstore/cosign-installer@v4.1.3 # no floating major tag upstream
      - uses: anchore/sbom-action/download-syft@v0
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Releases published with GITHUB_TOKEN do not trigger other workflows; workflow_dispatch is
  # the exception, so the clean-host check (#129) is started explicitly.
  install-check:
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Start the Install workflow
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh workflow run install.yml -R "$GITHUB_REPOSITORY" --ref main -f version="${TAG#v}"

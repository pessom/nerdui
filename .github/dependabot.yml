version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    groups:
      containerd:
        patterns:
          - "github.com/containerd/*"

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps-web)"
    ignore:
      # openapi-typescript (peer typescript ^5) and typescript-eslint (<6.1) do not support TS 6/7 yet.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      lint:
        patterns: ["eslint*", "@eslint/*", "typescript-eslint", "prettier"]
      test:
        patterns: ["vitest", "jsdom", "@testing-library/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps-docker)"

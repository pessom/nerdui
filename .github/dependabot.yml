version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    groups:
      containerd:
        patterns:
          - "github.com/containerd/*"

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps-web)"
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      lint:
        patterns: ["eslint*", "@eslint/*", "typescript-eslint", "prettier"]
      test:
        patterns: ["vitest", "jsdom", "@testing-library/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps-docker)"

name: Feature request
description: Suggest a new feature or improvement
title: "feat: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? Who is affected?
      placeholder: I'm always frustrated when ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like nerdui to do?
    validations:
      required: true
  - type: textarea
    id: nerdctl
    attributes:
      label: Equivalent nerdctl command
      description: If this maps to an existing nerdctl command/flag, please specify it.
      placeholder: nerdctl container prune --filter ...
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Containers
        - Images
        - Volumes
        - Networks
        - Compose
        - Namespaces
        - Logs / Exec
        - Auth / Security
        - API
        - UI / UX
        - Build / Release
        - Other
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, screenshots, links.

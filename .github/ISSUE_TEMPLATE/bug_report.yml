name: Bug report
description: Something does not work as expected
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please check [existing issues](../issues) first.
        **Do not report security vulnerabilities here** — see [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open '...'
        2. Click '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: nerdui-version
    attributes:
      label: nerdui version
      description: Output of `nerdui --version` or the version shown in the UI.
    validations:
      required: true
  - type: input
    id: runtime-versions
    attributes:
      label: containerd / nerdctl versions
      description: Output of `nerdctl version` on the host.
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How is nerdui deployed?
      options:
        - Binary on host
        - Container image
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Host OS and architecture
      placeholder: Ubuntu 24.04, amd64
  - type: input
    id: browser
    attributes:
      label: Browser (for UI issues)
      placeholder: Chrome 140
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant nerdui logs (run with `--log-level debug`). Remove secrets.
      render: shell

services:
  n8n:
    image: n8nio/n8n:${VERSION:-2.50.3}
    restart: unless-stopped
    environment:
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: ${TIMEZONE:-UTC}
      TZ: ${TIMEZONE:-UTC}
    ports:
      - "${PORT:-5678}:5678"
    volumes:
      - data:/home/node/.n8n
volumes:
  data:

services:
  meilisearch:
    image: getmeili/meilisearch:${VERSION:-v1}
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MASTER_API_KEY:?set MASTER_API_KEY}
      MEILI_ENV: production
    ports:
      - "${PORT:-7700}:7700"
    volumes:
      - data:/meili_data
volumes:
  data:

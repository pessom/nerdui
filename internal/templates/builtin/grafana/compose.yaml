services:
  grafana:
    image: grafana/grafana-oss:${VERSION:-latest}
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
    ports:
      - "${PORT:-3002}:3000"
    volumes:
      - data:/var/lib/grafana
volumes:
  data:

services:
  telegraf:
    image: telegraf:${VERSION:-1.40}-alpine
    restart: unless-stopped
    depends_on:
      - influxdb
    environment:
      INFLUX_TOKEN: ${INFLUX_TOKEN:?set INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG:-nerdui}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-telegraf}
    # Writes a minimal configuration, then starts Telegraf with it.
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat > /tmp/telegraf.conf <<'EOF'
        [agent]
          interval = "10s"
        [[outputs.influxdb_v2]]
          urls = ["http://influxdb:8086"]
          token = "$${INFLUX_TOKEN}"
          organization = "$${INFLUX_ORG}"
          bucket = "$${INFLUX_BUCKET}"
        [[inputs.cpu]]
        [[inputs.mem]]
        [[inputs.disk]]
        [[inputs.system]]
        EOF
        exec /entrypoint.sh telegraf --config /tmp/telegraf.conf
  influxdb:
    image: influxdb:2
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USER:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD:?set INFLUX_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-nerdui}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-telegraf}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:?set INFLUX_TOKEN}
    ports:
      - "${PORT:-8086}:8086"
    volumes:
      - data:/var/lib/influxdb2
      - config:/etc/influxdb2
volumes:
  data:
  config:

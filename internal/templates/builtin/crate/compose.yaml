services:
  crate:
    image: crate:${VERSION:-6.5}
    restart: unless-stopped
    command: ["crate", "-Cdiscovery.type=single-node"]
    environment:
      CRATE_HEAP_SIZE: ${HEAP:-1g}
    ports:
      - "${HTTP_PORT:-4200}:4200"
      - "${PG_PORT:-5433}:5432"
    volumes:
      - data:/data
volumes:
  data:

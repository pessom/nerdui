services:
  postfixadmin:
    image: postfixadmin:${VERSION:-4}-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTFIXADMIN_DB_TYPE: mysqli
      POSTFIXADMIN_DB_HOST: db
      POSTFIXADMIN_DB_USER: postfixadmin
      POSTFIXADMIN_DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      POSTFIXADMIN_DB_NAME: postfixadmin
      POSTFIXADMIN_SMTP_SERVER: ${SMTP_SERVER:-localhost}
      POSTFIXADMIN_SMTP_PORT: ${SMTP_PORT:-25}
    ports:
      - "${PORT:-8128}:80"
  db:
    image: percona/percona-server:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: postfixadmin
      MYSQL_USER: postfixadmin
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      start_period: 60s
      retries: 5
volumes:
  db:

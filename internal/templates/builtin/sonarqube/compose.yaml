services:
  sonarqube:
    image: sonarqube:${VERSION:-community}
    restart: unless-stopped
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "${PORT:-9000}:9000"
    volumes:
      - data:/opt/sonarqube/data
      - extensions:/opt/sonarqube/extensions
      - logs:/opt/sonarqube/logs
volumes:
  data:
  extensions:
  logs:

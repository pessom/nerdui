services:
  rocketchat:
    image: rocketchat/rocket.chat:${VERSION:-8.9.1}
    restart: unless-stopped
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    environment:
      MONGO_URL: mongodb://mongo:27017/rocketchat?replicaSet=rs0
      ROOT_URL: ${ROOT_URL:-http://localhost:8124}
      PORT: "3000"
    ports:
      - "${PORT:-8124}:3000"
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - data:/data/db
  # Initializes the replica set once MongoDB answers, then exits.
  mongo-init:
    image: mongo:8.0
    restart: "no"
    depends_on:
      - mongo
    command:
      - bash
      - -c
      - |
        until mongosh --host mongo --quiet --eval 'try { rs.status().ok } catch (e) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]}).ok }' | grep -q 1; do sleep 2; done
volumes:
  data:

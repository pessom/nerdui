services:
  yourls:
    image: yourls:${VERSION:-1.10}-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      YOURLS_DB_HOST: db
      YOURLS_DB_NAME: yourls
      YOURLS_DB_USER: yourls
      YOURLS_DB_PASS: ${DB_PASSWORD:?set DB_PASSWORD}
      YOURLS_SITE: ${SITE:-http://localhost:8118}
      YOURLS_USER: ${ADMIN_USER:-admin}
      YOURLS_PASS: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
    ports:
      - "${PORT:-8118}:80"
  db:
    image: percona/percona-server:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: yourls
      MYSQL_USER: yourls
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      start_period: 60s
      retries: 5
volumes:
  db:

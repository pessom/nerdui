services:
  searxng:
    image: searxng/searxng:${VERSION:-latest}
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: ${BASE_URL:-http://localhost:8146/}
    ports:
      - "${PORT:-8146}:8080"
    volumes:
      - config:/etc/searxng
      - cache:/var/cache/searxng
volumes:
  config:
  cache:

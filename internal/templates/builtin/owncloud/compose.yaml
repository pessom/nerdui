services:
  owncloud:
    image: owncloud/server:${VERSION:-10.16}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      OWNCLOUD_DOMAIN: ${DOMAIN:-localhost:8121}
      OWNCLOUD_TRUSTED_DOMAINS: ${TRUSTED_DOMAINS:-localhost}
      OWNCLOUD_DB_TYPE: mysql
      OWNCLOUD_DB_HOST: db
      OWNCLOUD_DB_NAME: owncloud
      OWNCLOUD_DB_USERNAME: owncloud
      OWNCLOUD_DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      OWNCLOUD_ADMIN_USERNAME: ${ADMIN_USER:-admin}
      OWNCLOUD_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      OWNCLOUD_MYSQL_UTF8MB4: "true"
      OWNCLOUD_REDIS_ENABLED: "true"
      OWNCLOUD_REDIS_HOST: redis
    ports:
      - "${PORT:-8121}:8080"
    volumes:
      - files:/mnt/data
  db:
    image: percona/percona-server:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: owncloud
      MYSQL_USER: owncloud
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      start_period: 60s
      retries: 5
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis:/data
volumes:
  files:
  db:
  redis:

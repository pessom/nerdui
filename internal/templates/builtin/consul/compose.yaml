services:
  consul:
    image: hashicorp/consul:${VERSION:-2.1}
    restart: unless-stopped
    command: ["agent", "-server", "-bootstrap-expect=1", "-ui", "-client=0.0.0.0"]
    ports:
      - "${PORT:-8500}:8500"
      - "${DNS_PORT:-8600}:8600/udp"
    volumes:
      - data:/consul/data
volumes:
  data:

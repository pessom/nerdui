services:
  mongo-express:
    image: mongo-express:${VERSION:-1}
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://root:${MONGO_PASSWORD:?set MONGO_PASSWORD}@mongo:27017/
      ME_CONFIG_BASICAUTH: "true"
      ME_CONFIG_BASICAUTH_USERNAME: ${WEB_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${WEB_PASSWORD:?set WEB_PASSWORD}
    ports:
      - "${PORT:-8123}:8081"
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD}
    volumes:
      - data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      start_period: 30s
      retries: 5
volumes:
  data:
